name: API connection safety messages l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          a=s.index('Future<void> _testConnection')
          b=s.index('class _ProviderPreset',a)
          q=s[a:b]
          start=q.index('    messenger.showSnackBar(const SnackBar(', q.index('providerKeyStaleForChangedHost'))
          end=q.index('    return;',start)
          q=q[:start]+"""    messenger.showSnackBar(SnackBar(
        content: Text(AppStrings.of(context).es
            ? 'Cambiaste el host: introduce una clave API diferente (o bórrala) antes de probar. Tu clave guardada nunca se envía a un host nuevo.'
            : 'You changed the host — enter a different API key (or clear it) before testing. Your saved key is never sent to a new host.')));
"""+q[end:]
          marker="    messenger.showSnackBar(SnackBar(\n        content: Text('Couldn\\'t reach the server"
          start=q.index(marker)
          end=q.index('  }\n}',start)
          q=q[:start]+"""    messenger.showSnackBar(SnackBar(
        content: Text(AppStrings.of(context).es
            ? 'No se pudo contactar con el servidor; comprueba la URL y tu conexión. ($e)'
            : 'Couldn\\'t reach the server — check the URL and your connection. ($e)')));
"""+q[end:]
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API connection safety messages'
          git push origin HEAD:spanish-localization
