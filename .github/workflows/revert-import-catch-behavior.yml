name: Restore original import catch behavior
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart'); s=p.read_text()
          start=s.find('    } catch (e) {', s.find('void _scheduleImport'))
          end=s.find('  });\n}', start)
          if start < 0 or end < 0: raise SystemExit('schedule import catch not found')
          block=s[start:end]
          if 'No se pudo importar la tarjeta.' not in block: raise SystemExit('unexpected catch block')
          s=s[:start] + '    } catch (_) {/* swallow — UI still works */}\n' + s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/main.dart
          git commit -m 'Restore original import catch behavior'
          git push origin HEAD:spanish-localization
