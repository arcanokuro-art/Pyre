name: Profile l10n 3
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          pairs={
          "            'Optional. Shown as the creator on cards you build in the '\n            'Character Creator — this is not a BotBooru account, nothing to '\n            'sign into. Case-sensitive on botbooru.com.',":"            es ? 'Opcional. Se muestra como creador en las tarjetas que haces con el Creador de personajes. No es una cuenta de BotBooru y no hay que iniciar sesión. En botbooru.com distingue mayúsculas y minúsculas.' : 'Optional. Shown as the creator on cards you build in the Character Creator — this is not a BotBooru account, nothing to sign into. Case-sensitive on botbooru.com.',",
          "            'Title',":"            es ? 'Título' : 'Title',",
          "                    'e.g. \"Slow-burn enthusiast\", \"Just here for the chaos\"')":"                    es ? 'p. ej. \"Fan del slow burn\", \"Aquí por el caos\"' : 'e.g. \"Slow-burn enthusiast\", \"Just here for the chaos\"')",
          "            'Short subtitle that sits under your name. Empty hides it.',":"            es ? 'Subtítulo corto que aparece debajo de tu nombre. Si está vacío, se oculta.' : 'Short subtitle that sits under your name. Empty hides it.',",
          "            'Pronouns (optional)',":"            es ? 'Pronombres (opcional)' : 'Pronouns (optional)',",
          "            decoration: _dec('e.g. she/her, they/them, he/him').copyWith(":"            decoration: _dec(es ? 'p. ej. ella, elle, él' : 'e.g. she/her, they/them, he/him').copyWith("
          }
          for a,b in pairs.items():
            if a not in s: raise SystemExit('missing identity marker: '+a[:30])
            s=s.replace(a,b,1)
          # About Me build gets its own locale flag.
          pos=s.index('class _AboutMeSection'); marker='  Widget build(BuildContext context) {\n'
          idx=s.index(marker,pos); s=s[:idx]+s[idx:].replace(marker,marker+'    final es = AppStrings.of(context).es;\n',1)
          s=s.replace("              'ABOUT ME',","              es ? 'ACERCA DE MÍ' : 'ABOUT ME',",1)
          s=s.replace("              'A short bio for your profile. Whatever you want — '\n              'tropes you love, favorite genres, what you\\'re into.',","              es ? 'Una breve biografía para tu perfil. Lo que quieras: tropos que te gustan, géneros favoritos y tus intereses.' : 'A short bio for your profile. Whatever you want — tropes you love, favorite genres, what you\\'re into.',",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize profile identity details and About Me'
          git push origin HEAD:spanish-localization
