name: API provider info l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart')
          s=p.read_text()
          a="'By default every call uses your active chat provider. Pin a '\n              'different one here for the Creator or for image analysis — '\n              'e.g. DeepSeek for chat and creator text, Qwen-VL only for '\n              'vision. Vision falls back to creator → chat.',"
          b="AppStrings.of(context).es\n                  ? 'De forma predeterminada, cada solicitud usa tu proveedor de chat activo. Puedes fijar aquí otro para el Creador o para el análisis de imágenes; por ejemplo, DeepSeek para chat y texto del creador, y Qwen-VL solo para visión. Visión recurre a creador → chat si es necesario.'\n                  : 'By default every call uses your active chat provider. Pin a different one here for the Creator or for image analysis — e.g. DeepSeek for chat and creator text, Qwen-VL only for vision. Vision falls back to creator → chat.',"
          if s.count(a)!=1: raise SystemExit('target missing')
          p.write_text(s.replace(a,b,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API provider override information'
          git push origin HEAD:spanish-localization
