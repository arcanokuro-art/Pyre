name: Profile featured rest
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          a="""                    editMode
                        ? 'Pin one of your characters as your '
                            'featured spotlight. It\\'s a pure curation '
                            'choice — no functional impact, just a way '
                            'to show off what you\\'re proud of.'
                        : 'No character pinned yet. Tap Edit to '
                            'pick one to spotlight here.',"""
          b="""                    editMode
                        ? (es ? 'Fija uno de tus personajes como destacado. Es solo una elección de presentación: no tiene ningún efecto funcional.' : 'Pin one of your characters as your featured spotlight. It\\'s a pure curation choice — no functional impact, just a way to show off what you\\'re proud of.')
                        : (es ? 'Todavía no hay ningún personaje fijado. Pulsa Editar para elegir uno y destacarlo aquí.' : 'No character pinned yet. Tap Edit to pick one to spotlight here.'),"""
          if a not in s: raise SystemExit('empty-state marker missing')
          s=s.replace(a,b,1)
          a="""                  'No characters in your library yet. Build or import '
                  'a card first, then come back to pin it here.',"""
          b="""                  es ? 'Todavía no hay personajes en tu biblioteca. Crea o importa una tarjeta y vuelve aquí para fijarla.' : 'No characters in your library yet. Build or import a card first, then come back to pin it here.',"""
          if a not in s: raise SystemExit('library-empty marker missing')
          s=s.replace(a,b,1)
          s=s.replace("                        title: const Text('Remove featured'),","                        title: Text(es ? 'Quitar destacado' : 'Remove featured'),",1)
          s=s.replace("                        subtitle: const Text(\n                          'Hide the featured card from your profile.',\n                          style: TextStyle(fontSize: 11),\n                        ),","                        subtitle: Text(\n                          es ? 'Oculta la tarjeta destacada de tu perfil.' : 'Hide the featured card from your profile.',\n                          style: const TextStyle(fontSize: 11),\n                        ),",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize remaining featured profile text'
          git push origin HEAD:spanish-localization
