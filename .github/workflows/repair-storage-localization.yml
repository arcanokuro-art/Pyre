name: Repair storage localization

on:
  push:
    branches:
      - spanish-localization

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Repair storage screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/storage_screen.dart')
          s=p.read_text()
          old="""                    t('Elimina todos los personajes, chats, personas, preajustes, libros de lore y conexiones API almacenados en este dispositivo. Tus ajustes (temperatura, comportamiento del chat, etc.) se conservan. No se puede deshacer.\\n\\n', 'Removes every character, chat, persona, preset, lorebook and API connection stored on this device. Your settings (temperature, chat behaviour, etc.) are kept. There is no undo.\\n\\n')
                    'For a full factory reset that also wipes settings, '
                    'use Backup & Restore → Advanced → Reset to factory settings.',
"""
          new="""                    t(
                      'Elimina todos los personajes, chats, personas, preajustes, libros de lore y conexiones API almacenados en este dispositivo. Tus ajustes (temperatura, comportamiento del chat, etc.) se conservan. No se puede deshacer.\\n\\nPara un restablecimiento completo que también borre los ajustes, usa Copia de seguridad y restauración → Avanzado → Restablecer a valores de fábrica.',
                      'Removes every character, chat, persona, preset, lorebook and API connection stored on this device. Your settings (temperature, chat behaviour, etc.) are kept. There is no undo.\\n\\nFor a full factory reset that also wipes settings, use Backup & Restore → Advanced → Reset to factory settings.',
                    ),
"""
          if old not in s: raise SystemExit('malformed block not found')
          s=s.replace(old,new,1)
          s=s.replace("label: Text(\n                      'Clear library',", "label: Text(\n                      t('Borrar biblioteca', 'Clear library'),",1)
          s=s.replace("const SnackBar(\n        content: Text(\n            'Snapshot saved. Previous state rotated into bak.0.'),\n        duration: Duration(seconds: 2),\n      )", "SnackBar(\n        content: Text(AppStrings.of(context).es ? 'Instantánea guardada. El estado anterior se movió a bak.0.' : 'Snapshot saved. Previous state rotated into bak.0.'),\n        duration: const Duration(seconds: 2),\n      )",1)
          s=s.replace("? 'Error log is empty — no crashes recorded.'\n              : 'Copied $bytes B of error log to clipboard.'", "? (AppStrings.of(context).es ? 'El registro de errores está vacío; no se registraron fallos.' : 'Error log is empty — no crashes recorded.')\n              : (AppStrings.of(context).es ? 'Se copiaron $bytes B del registro de errores al portapapeles.' : 'Copied $bytes B of error log to clipboard.')",1)
          s=s.replace("const SnackBar(\n            content:\n                Text('Error log is empty — no crashes recorded.'),\n          )", "SnackBar(\n            content: Text(AppStrings.of(context).es ? 'El registro de errores está vacío; no se registraron fallos.' : 'Error log is empty — no crashes recorded.'),\n          )",1)
          s=s.replace("subject: 'Pyre error log',", "subject: AppStrings.of(context).es ? 'Registro de errores de Pyre' : 'Pyre error log',",1)
          s=s.replace("SnackBar(content: Text('Could not share log: $e'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'No se pudo compartir el registro: $e' : 'Could not share log: $e'))",1)
          s=s.replace("const SnackBar(content: Text('Error log cleared.'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'Registro de errores borrado.' : 'Error log cleared.'))",1)
          p.write_text(s)
          PY
      - name: Format and commit
        run: |
          dart format lib/screens/storage_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/storage_screen.dart
          git commit -m 'Repair and localize storage screen'
          git push origin HEAD:spanish-localization
