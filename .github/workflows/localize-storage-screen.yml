name: Localize storage screen
on:
  push:
    branches: [spanish-localization]
    paths: ['.github/workflows/localize-storage-screen.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch visible storage strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/storage_screen.dart')
          s=p.read_text()
          s=s.replace("import '../services/error_log.dart';", "import '../l10n/app_strings.dart';\nimport '../services/error_log.dart';")
          s=s.replace("    final store = context.watch<AppStore>();", "    final store = context.watch<AppStore>();\n    final es = AppStrings.of(context).es;\n    String t(String spanish, String english) => es ? spanish : english;")
          replacements={
            "appBar: AppBar(title: const Text('Storage'))":"appBar: AppBar(title: Text(t('Almacenamiento', 'Storage')))",
            "const Text('Local data',":"Text(t('Datos locales', 'Local data'),",
            "Text('$used used (main + rotated backups)',":"Text(t('$used usados (principal + copias rotativas)', '$used used (main + rotated backups)'),",
            "label: 'Characters'":"label: t('Personajes', 'Characters')",
            "label: 'Personas'":"label: 'Personas'",
            "label: 'Chats'":"label: 'Chats'",
            "label: 'Lorebooks'":"label: t('Libros de lore', 'Lorebooks')",
            "label: 'Presets (visible)'":"label: t('Preajustes (visibles)', 'Presets (visible)')",
            "label: 'Providers'":"label: t('Proveedores', 'Providers')",
            "'Save snapshot now'":"t('Guardar instantánea ahora', 'Save snapshot now')",
            "const Text('Diagnostics',":"Text(t('Diagnósticos', 'Diagnostics'),",
            "'Copy error log'":"t('Copiar registro de errores', 'Copy error log')",
            "'Share error log'":"t('Compartir registro de errores', 'Share error log')",
            "'Clear log'":"t('Borrar registro', 'Clear log')",
            "const Text(\n                    'Clear library',":"Text(\n                    t('Borrar biblioteca', 'Clear library'),",
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace("'Crashes and uncaught exceptions are logged to a '\n                    'file on this device only. Nothing leaves your '\n                    'phone unless you tap one of the buttons below.'", "t('Los fallos y las excepciones no controladas se registran únicamente en un archivo de este dispositivo. Nada sale de tu dispositivo a menos que pulses uno de los botones de abajo.', 'Crashes and uncaught exceptions are logged to a file on this device only. Nothing leaves your phone unless you tap one of the buttons below.')")
          s=s.replace("'Removes every character, chat, persona, preset, lorebook '\n                    'and API connection stored on this device. '\n                    'Your settings (temperature, chat behaviour, etc.) are kept. '\n                    'There is no undo.\\n\\n'", "t('Elimina todos los personajes, chats, personas, preajustes, libros de lore y conexiones API almacenados en este dispositivo. Tus ajustes (temperatura, comportamiento del chat, etc.) se conservan. No se puede deshacer.\\n\\n', 'Removes every character, chat, persona, preset, lorebook and API connection stored on this device. Your settings (temperature, chat behaviour, etc.) are kept. There is no undo.\\n\\n')")
          p.write_text(s)
          PY
          dart format lib/screens/storage_screen.dart || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/storage_screen.dart
          git diff --cached --quiet || git commit -m 'Localize primary storage screen UI [skip ci]'
          git push
