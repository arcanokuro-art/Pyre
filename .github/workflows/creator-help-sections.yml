name: Creator help sections
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          # Edit with AI: replace paragraph structurally inside What you can build.
          marker="**Edit with AI**"
          pos=s.index(marker)
          a=s.rfind('          HowItWorksBlock.paragraph(',0,pos)
          b=s.index('),\n        ]),',pos)+2
          old=s[a:b]
          new="""          HowItWorksBlock.paragraph(es
              ? '**Editar con IA** no es una opción inicial: sirve para volver a abrir en el Creador un personaje o persona EXISTENTE desde su acción «Editar con IA». Carga la tarjeta en la ficha y cada mensaje se convierte en una edición parcial, modificando solo lo que pidas. Funciona con tarjetas creadas en cualquier lugar y conserva el formato original salvo que pidas cambiarlo.'
              : '**Edit with AI** isn\\'t a starting choice — it\\'s how you open an EXISTING character or persona back into the Creator. It loads the card on the sheet and every message becomes a partial edit, touching only what you asked. It works on cards built ANYWHERE and preserves the original format unless you ask it to change.')"""
          s=s[:a]+new+s[b:]
          # What gets built opening paragraph, bounded by next bullet.
          anchor="HowItWorksSection(es ? 'Qué se crea' : 'What gets built', ["
          pos=s.index(anchor)
          a=s.index('          HowItWorksBlock.paragraph(',pos)
          b=s.index('          HowItWorksBlock.bullet(',a)
          old=s[a:b]
          if 'architect fills' not in old: raise SystemExit('built intro validation failed')
          new="""          HowItWorksBlock.paragraph(es
              ? 'No tienes que dirigir esta parte: el arquitecto completa toda la tarjeta en orden y deja el cierre (eslogan, notas del creador y etiquetas) para el final, de modo que pueda tomar en cuenta todo lo anterior.'
              : 'You don\\'t drive any of this — the architect fills the whole card for you in order, saving the wrap-up (tagline, creator notes, tags) for last so it can reference everything that came before.'),
"""
          s=s[:a]+new+s[b:]
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator edit and built content help'
          git push origin HEAD:spanish-localization
