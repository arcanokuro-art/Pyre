name: Persona export banner simple l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          # Only alter the persona banner block, located after its gallery export loop.
          start=s.find('    final banner = galleryExported > 0')
          if start < 0: raise SystemExit('banner start missing')
          end=s.find('    await deliverExport(', start)
          if end < 0: raise SystemExit('banner end missing')
          block=s[start:end]
          new="""    final es = AppStrings.of(context).es;
    final banner = galleryExported > 0
        ? (es
            ? 'Exportado — ${file.uri.pathSegments.last} (+$galleryExported ${galleryExported == 1 ? 'imagen' : 'imágenes'} de galería)'
            : 'Exported — ${file.uri.pathSegments.last} (+$galleryExported gallery ${galleryExported == 1 ? 'image' : 'images'})')
        : (es
            ? 'Exportado — ${file.uri.pathSegments.last}'
            : 'Exported — ${file.uri.pathSegments.last}');
"""
          s=s[:start]+new+s[end:]
          p.write_text(s)
          print('replaced banner chars',len(block))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize persona export banner safely'
          git push origin HEAD:spanish-localization
