name: Profile remove featured l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          a="title: const Text('Remove featured'),"
          b="title: Text(es ? 'Quitar destacado' : 'Remove featured'),"
          if a not in s: raise SystemExit('title missing')
          s=s.replace(a,b,1)
          a="""subtitle: const Text(
                          'Hide the featured card from your profile.',
                          style: TextStyle(fontSize: 11),
                        ),"""
          b="""subtitle: Text(
                          es ? 'Oculta la tarjeta destacada de tu perfil.' : 'Hide the featured card from your profile.',
                          style: const TextStyle(fontSize: 11),
                        ),"""
          if a not in s: raise SystemExit('subtitle missing')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize remove featured controls'
          git push origin HEAD:spanish-localization
