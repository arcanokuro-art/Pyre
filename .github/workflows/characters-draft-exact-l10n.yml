name: Characters draft exact l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          old="""                  'You have in-progress cards. Tap one to resume; '
                  'long-press to delete.',"""
          new="""                  AppStrings.of(context).es
                      ? 'Tienes tarjetas en progreso. Toca una para continuar; mantén pulsado para eliminarla.'
                      : 'You have in-progress cards. Tap one to resume; long-press to delete.',"""
          if old not in s: raise SystemExit('draft help missing')
          s=s.replace(old,new,1)
          old="""                              'Permanently discard \"$title\"? '
                              'This cannot be undone.'),"""
          new="""                              AppStrings.of(context).es
                                  ? '¿Descartar permanentemente \"$title\"? Esta acción no se puede deshacer.'
                                  : 'Permanently discard \"$title\"? This cannot be undone.'),"""
          if old not in s: raise SystemExit('draft delete missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize draft chooser exact blocks'
          git push origin HEAD:spanish-localization
