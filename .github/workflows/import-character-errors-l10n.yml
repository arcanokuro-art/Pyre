name: Character URL import errors l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('Future<void> _showImportCharacterDialog')
          b=s.index('Future<void> _assertHostResolvesPublic',a)
          q=s[a:b]
          q=q.replace("throw 'Only https:// URLs are accepted.';", "throw (AppStrings.of(ctx).es ? 'Solo se aceptan URL https://.' : 'Only https:// URLs are accepted.');")
          q=q.replace("throw \"Couldn't import — that link points to a \"\n                              'private or local address.';", "throw (AppStrings.of(ctx).es ? 'No se pudo importar: ese enlace apunta a una dirección privada o local.' : \"Couldn't import — that link points to a private or local address.\");",1)
          q=q.replace("throw 'Not a valid character card: $e';", "throw (AppStrings.of(ctx).es ? 'No es una tarjeta de personaje válida: $e' : 'Not a valid character card: $e');",1)
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character URL import validation errors'
          git push origin HEAD:spanish-localization
