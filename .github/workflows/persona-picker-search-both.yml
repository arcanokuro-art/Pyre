name: Persona search hints l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          target="hintText: 'Search personas…',"
          if s.count(target) != 2: raise SystemExit('unexpected count')
          s=s.replace(target,"hintText: AppStrings.of(context).es ? 'Buscar personas…' : 'Search personas…',")
          old="decoration: const InputDecoration(\n                prefixIcon: Icon(Icons.search, size: 18),\n                hintText: AppStrings.of(context).es"
          new="decoration: InputDecoration(\n                prefixIcon: const Icon(Icons.search, size: 18),\n                hintText: AppStrings.of(context).es"
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize persona search hints'
          git push origin HEAD:spanish-localization
