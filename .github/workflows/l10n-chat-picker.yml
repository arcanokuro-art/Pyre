name: Localize chat picker
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/l10n-chat-picker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch visible chat picker title
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/chat_picker_screens.dart')
          s = p.read_text()
          old = """  final store = context.read<AppStore>();
  // Dead-context fix"""
          new = """  final store = context.read<AppStore>();
  final es = AppStrings.of(context).es;
  // Dead-context fix"""
          if old not in s:
              raise SystemExit('store anchor not found')
          s = s.replace(old, new, 1)
          old = """        title: 'Personas for the chat with ${primary.name}',"""
          new = """        title: es
            ? 'Personas para el chat con ${primary.name}'
            : 'Personas for the chat with ${primary.name}',"""
          if old not in s:
              raise SystemExit('title anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/chat_picker_screens.dart
          git diff --cached --check
          git commit -m "Localize solo chat persona picker title"
          git push origin HEAD:spanish-localization
