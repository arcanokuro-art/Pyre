name: Fix storage debug const
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/storage_screen.dart')
          s=p.read_text()
          s=s.replace("title: const Text((AppStrings.of(context).es ?", "title: Text((AppStrings.of(context).es ?",1)
          s=s.replace("label: const Text((AppStrings.of(context).es ?", "label: Text((AppStrings.of(context).es ?",1)
          s=s.replace("const Text('Developer',", "Text(AppStrings.of(context).es ? 'Desarrollador' : 'Developer',",1)
          s=s.replace("'Stored locally on this device; contains your chat text; '\n              'never your API key. For debugging.'", "AppStrings.of(context).es ? 'Se almacena localmente en este dispositivo; contiene el texto de tus chats, pero nunca tu clave API. Para depuración.' : 'Stored locally on this device; contains your chat text; never your API key. For debugging.'",1)
          s=s.replace("subtitle: const Text(\n                'Records every request + response, tagged per feature, '\n                'to a JSONL file you can export.'", "subtitle: Text(\n                AppStrings.of(context).es ? 'Registra cada solicitud y respuesta, etiquetadas por función, en un archivo JSONL que puedes exportar.' : 'Records every request + response, tagged per feature, to a JSONL file you can export.'",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/storage_screen.dart
          git commit -m 'Fix and localize storage debug card'
          git push origin HEAD:spanish-localization
