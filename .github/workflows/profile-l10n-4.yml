name: Profile l10n 4
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          s=s.replace("                hintText:\n                    'e.g. \"Slice-of-life teacher cards with soft '\n                    'NSFW. I like flawed-but-warm characters and '\n                    'slow-burn pacing.\"',", "                hintText: es ? 'p. ej. \"Tarjetas slice-of-life con personajes imperfectos pero cálidos y un ritmo slow burn.\"' : 'e.g. \"Slice-of-life teacher cards with soft NSFW. I like flawed-but-warm characters and slow-burn pacing.\"',",1)
          s=s.replace("            'ABOUT',", "            es ? 'ACERCA DE MÍ' : 'ABOUT',",1)
          pos=s.index('class _StatsCard'); marker='  Widget build(BuildContext context) {\n'
          idx=s.index(marker,pos); s=s[:idx]+s[idx:].replace(marker,marker+'    final es = AppStrings.of(context).es;\n',1)
          s=s.replace("label: 'cards built'", "label: es ? 'tarjetas creadas' : 'cards built'",1)
          s=s.replace("label: 'in library'", "label: es ? 'en biblioteca' : 'in library'",1)
          s=s.replace("label: 'chats'", "label: es ? 'chats' : 'chats'",1)
          s=s.replace("label: 'days'", "label: es ? 'días' : 'days'",1)
          pos=s.index('class _UsageStatsCard'); idx=s.index(marker,pos); s=s[:idx]+s[idx:].replace(marker,marker+'    final es = AppStrings.of(context).es;\n',1)
          s=s.replace("              'Usage',", "              es ? 'Uso' : 'Usage',",1)
          s=s.replace("value: userMessages, label: 'messages sent'", "value: userMessages, label: es ? 'mensajes enviados' : 'messages sent'",1)
          s=s.replace("value: assistantReplies, label: 'replies'", "value: assistantReplies, label: es ? 'respuestas' : 'replies'",1)
          s=s.replace("value: cardsImported, label: 'imported'", "value: cardsImported, label: es ? 'importadas' : 'imported'",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize profile About and statistics'
          git push origin HEAD:spanish-localization
