name: Character picker empty subtitles l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="          subtitle: liveCount == 0\n              ? 'Import or create one from the Library tab.'\n              : q.isNotEmpty\n                  ? 'Try a different search term.'\n                  : 'They\\'re all members already.',"
          new="          subtitle: liveCount == 0\n              ? (AppStrings.of(context).es ? 'Importa o crea uno desde la pestaña Biblioteca.' : 'Import or create one from the Library tab.')\n              : q.isNotEmpty\n                  ? (AppStrings.of(context).es ? 'Prueba con otro término de búsqueda.' : 'Try a different search term.')\n                  : (AppStrings.of(context).es ? 'Todos ya son miembros.' : 'They\\'re all members already.'),"
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize character picker empty subtitles'
          git push origin HEAD:spanish-localization
