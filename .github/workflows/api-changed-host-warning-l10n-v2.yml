name: API changed host warning l10n v2
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          needle='You changed the host — enter a different API key'
          i=s.find(needle)
          if i<0: raise SystemExit('changed host warning missing')
          start=s.rfind('messenger.showSnackBar(',0,i)
          end=s.find(');\n    return;',i)
          if start<0 or end<0: raise SystemExit('warning bounds missing')
          old=s[start:end+2]
          if 'saved key is never sent' not in old: raise SystemExit('unexpected warning block')
          new="""messenger.showSnackBar(SnackBar(
        content: Text(AppStrings.of(context).es
            ? 'Cambiaste el servidor; introduce una clave de API diferente (o bórrala) antes de probar. Tu clave guardada nunca se envía a un servidor nuevo.'
            : 'You changed the host — enter a different API key (or clear it) before testing. Your saved key is never sent to a new host.')));"""
          p.write_text(s[:start]+new+s[end+2:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize changed host API key warning v2'
          git push origin HEAD:spanish-localization
