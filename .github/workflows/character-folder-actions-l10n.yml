name: Character folder actions l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('Future<void> _showFoldersSheet')
          b=s.index('Future<String?> _promptFolderName',a)
          q=s[a:b]
          q=q.replace("message:\n                                            'Characters in this folder stay '\n                                            'in your library. Only the '\n                                            'folder grouping is removed.',", "message: AppStrings.of(sheetCtx).es\n                                            ? 'Los personajes de esta carpeta permanecerán en tu biblioteca. Solo se eliminará la agrupación de la carpeta.'\n                                            : 'Characters in this folder stay in your library. Only the folder grouping is removed.',",1)
          q=q.replace("itemBuilder: (_) => const [\n                                    PopupMenuItem(\n                                        value: 'rename',\n                                        child: Text('Rename')),\n                                    PopupMenuItem(\n                                        value: 'delete',\n                                        child: Text('Delete')),\n                                  ],", "itemBuilder: (_) => [\n                                    PopupMenuItem(\n                                        value: 'rename',\n                                        child: Text(AppStrings.of(sheetCtx).es ? 'Renombrar' : 'Rename')),\n                                    PopupMenuItem(\n                                        value: 'delete',\n                                        child: Text(AppStrings.of(sheetCtx).es ? 'Eliminar' : 'Delete')),\n                                  ],",1)
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character folder actions'
          git push origin HEAD:spanish-localization
