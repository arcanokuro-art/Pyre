name: Fix organization chip overflow

on:
  push:
    branches: [spanish-localization]
    paths:
      - '.github/workflows/fix-org-chip-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Make organization chips width-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/characters_screen.dart')
          s = p.read_text()
          old = """    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
      decoration: BoxDecoration(
        color: EmberColors.bgElevated,
        borderRadius: BorderRadius.circular(16),
        border: Border.all(color: EmberColors.stroke),
      ),
      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(icon, size: 14, color: EmberColors.textMid),
          const SizedBox(width: 6),
          Text(
            label,
            style:
                TextStyle(color: EmberColors.textHigh, fontSize: 12),
          ),"""
          new = """    return ConstrainedBox(
      constraints: BoxConstraints(
        maxWidth: MediaQuery.sizeOf(context).width - 32,
      ),
      child: Container(
        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
        decoration: BoxDecoration(
          color: EmberColors.bgElevated,
          borderRadius: BorderRadius.circular(16),
          border: Border.all(color: EmberColors.stroke),
        ),
        child: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Icon(icon, size: 14, color: EmberColors.textMid),
            const SizedBox(width: 6),
            Flexible(
              child: Text(
                label,
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                style:
                    TextStyle(color: EmberColors.textHigh, fontSize: 12),
              ),
            ),"""
          if old not in s:
              raise SystemExit('Expected _OrgChip pattern not found')
          s = s.replace(old, new, 1)
          old_end = """          if (trailing != null) ...[
            const SizedBox(width: 6),
            trailing!,
          ],
        ],
      ),
    );
  }
}"""
          new_end = """            if (trailing != null) ...[
              const SizedBox(width: 6),
              trailing!,
            ],
          ],
        ),
      ),
    );
  }
}"""
          if old_end not in s:
              raise SystemExit('Expected _OrgChip ending not found')
          p.write_text(s.replace(old_end, new_end, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/characters_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix organization chip overflow on narrow layouts"
          git push origin HEAD:spanish-localization
