name: Creator l10n 5
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          s=s.replace("'DEFAULT',", "AppStrings.of(context).es ? 'PREDETERMINADO' : 'DEFAULT',",1)
          s=s.replace("'The base architect prompts (Character / Scenario / Edit) '\n              'the Creator runs on. The shipped \"Pyre Default\" is '\n              'read-only — fork it to a custom preset to rewrite the '\n              'base prompts. Your additions above still append on top '\n              'of whichever preset is active.'", "AppStrings.of(context).es ? 'Los prompts base del arquitecto (Personaje / Escenario / Edición) que utiliza el Creador. \"Pyre Default\" es de solo lectura; crea una copia personalizada para modificar los prompts base. Tus añadidos de arriba se siguen agregando al preajuste que esté activo.' : 'The base architect prompts (Character / Scenario / Edit) the Creator runs on. The shipped \"Pyre Default\" is read-only — fork it to a custom preset to rewrite the base prompts. Your additions above still append on top of whichever preset is active.'",1)
          s=s.replace("label: Text(locked ? 'Fork or switch preset'\n                    : 'Manage prompt presets'),", "label: Text(AppStrings.of(context).es ? (locked ? 'Copiar o cambiar preajuste' : 'Administrar preajustes de prompts') : (locked ? 'Fork or switch preset' : 'Manage prompt presets')),",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator architect preset card'
          git push origin HEAD:spanish-localization
