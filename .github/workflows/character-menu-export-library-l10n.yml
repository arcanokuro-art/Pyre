name: Character menu export library l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('void _showCharacterMenu')
          b=s.index('void _showPersonaMenu', a)
          block=s[a:b]
          pairs=[
            ("_menuSectionLabel('Export'),", "_menuSectionLabel(AppStrings.of(context).es ? 'Exportar' : 'Export'),"),
            ("title: const Text('Export as PNG card'),", "title: Text(AppStrings.of(context).es ? 'Exportar como tarjeta PNG' : 'Export as PNG card'),"),
            ("title: const Text('Export as JSON card'),", "title: Text(AppStrings.of(context).es ? 'Exportar como tarjeta JSON' : 'Export as JSON card'),"),
            ("_menuSectionLabel('Library'),", "_menuSectionLabel(AppStrings.of(context).es ? 'Biblioteca' : 'Library'),"),
            ("title: const Text('Add to folder…'),", "title: Text(AppStrings.of(context).es ? 'Añadir a carpeta…' : 'Add to folder…'),"),
            ("'In: ${folderNames.join(\", \")}',", "AppStrings.of(context).es ? 'En: ${folderNames.join(\", \")}' : 'In: ${folderNames.join(\", \")}',"),
            ("title: Text('Delete character',", "title: Text(AppStrings.of(context).es ? 'Eliminar personaje' : 'Delete character',"),
            ("title: 'Delete \"${c.name}\"?',", "title: AppStrings.of(context).es ? '¿Eliminar \"${c.name}\"?' : 'Delete \"${c.name}\"?',"),
            ("message:\n                    'The character and every chat with them will be lost forever.',", "message: AppStrings.of(context).es\n                    ? 'El personaje y todos sus chats se perderán para siempre.'\n                    : 'The character and every chat with them will be lost forever.',"),
          ]
          for x,y in pairs:
            if block.count(x)!=1: raise SystemExit(f'matches {block.count(x)} for {x[:35]}')
            block=block.replace(x,y,1)
          p.write_text(s[:a]+block+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character menu export and library actions'
          git push origin HEAD:spanish-localization
