name: Backup reset final l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/backup_restore_screen.dart')
          s=p.read_text()
          s=s.replace("content: Text('Backup failed — reset aborted to keep your '\n              'data safe: $e')", "content: Text(AppStrings.of(context).es ? 'Falló la copia de seguridad; se canceló el restablecimiento para mantener tus datos seguros: $e' : 'Backup failed — reset aborted to keep your data safe: $e')",1)
          s=s.replace("missingImages > 0 ? 'Backup saved — with a warning' : 'Backup saved'", "AppStrings.of(context).es ? (missingImages > 0 ? 'Copia guardada, con una advertencia' : 'Copia guardada') : (missingImages > 0 ? 'Backup saved — with a warning' : 'Backup saved')",1)
          s=s.replace("child: const Text('Cancel')", "child: Text(AppStrings.of(context).es ? 'Cancelar' : 'Cancel')",1)
          s=s.replace("child: const Text('Reset now')", "child: Text(AppStrings.of(context).es ? 'Restablecer ahora' : 'Reset now')",1)
          s=s.replace("SnackBar(content: Text('Reset failed: $e'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'Falló el restablecimiento: $e' : 'Reset failed: $e'))",1)
          s=s.replace("messenger.showSnackBar(const SnackBar(\n        content: Text('Pyre has been reset to factory settings.')));", "messenger.showSnackBar(SnackBar(content: Text(AppStrings.of(context).es ? 'Pyre se ha restablecido a los valores de fábrica.' : 'Pyre has been reset to factory settings.')));",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/backup_restore_screen.dart
          git commit -m 'Localize factory reset result messages'
          git push origin HEAD:spanish-localization
