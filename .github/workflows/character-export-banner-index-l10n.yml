name: Character export banner index l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          fn=s.index('Future<void> _exportCharacterAsPng')
          a=s.index('    final banner = galleryExported > 0', fn)
          b=s.index('    await deliverExport(', a)
          old=s[a:b]
          if "'Exported —" not in old: raise SystemExit('unexpected banner block')
          new="""    final es = AppStrings.of(context).es;
    final banner = galleryExported > 0
        ? (es
            ? 'Exportado — ${file.uri.pathSegments.last} (+$galleryExported ${galleryExported == 1 ? 'imagen' : 'imágenes'} de galería)'
            : 'Exported — ${file.uri.pathSegments.last} (+$galleryExported gallery ${galleryExported == 1 ? 'image' : 'images'})')
        : (es
            ? 'Exportado — ${file.uri.pathSegments.last}'
            : 'Exported — ${file.uri.pathSegments.last}');
"""
          p.write_text(s[:a]+new+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character export banner'
          git push origin HEAD:spanish-localization
