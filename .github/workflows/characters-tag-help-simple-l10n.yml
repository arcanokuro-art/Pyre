name: Character tag help simple l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index("                    'Tap to select. Multiple selections AND together '")
          b=s.index("                    style: TextStyle(",a)
          new="""                    AppStrings.of(sheetCtx).es
                        ? 'Toca para seleccionar. Varias selecciones se combinan con Y; la tarjeta debe tener todas las etiquetas seleccionadas.'
                        : 'Tap to select. Multiple selections AND together (card must have all selected tags).',
"""
          p.write_text(s[:a]+new+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character tag picker explanation'
          git push origin HEAD:spanish-localization
