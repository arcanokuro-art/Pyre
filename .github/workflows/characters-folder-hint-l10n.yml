name: Character folder hint l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          old='decoration: const InputDecoration(hintText: \'e.g. "Bathhouse OCs"\'),'
          new='decoration: InputDecoration(hintText: AppStrings.of(ctx).es ? \'p. ej. "OCs del balneario"\' : \'e.g. "Bathhouse OCs"\'),'
          if s.count(old)!=1: raise SystemExit(f'count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character folder name hint'
          git push origin HEAD:spanish-localization
