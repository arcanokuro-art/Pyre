name: Character card tooltips l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('class _CharacterCard extends StatelessWidget')
          b=s.index('class _PersonaList extends StatelessWidget', a)
          block=s[a:b]
          pairs=[
            ("tooltip: character.favorite\n                  ? 'Remove from favorites'\n                  : 'Add to favorites',", "tooltip: character.favorite\n                  ? (AppStrings.of(context).es ? 'Quitar de favoritos' : 'Remove from favorites')\n                  : (AppStrings.of(context).es ? 'Añadir a favoritos' : 'Add to favorites'),"),
            ("tooltip: 'Character actions',", "tooltip: AppStrings.of(context).es ? 'Acciones del personaje' : 'Character actions',"),
            ("Expanded(child: _buildBody()),", "Expanded(child: _buildBody(context)),"),
            ("Widget _buildBody() {", "Widget _buildBody(BuildContext context) {"),
            ("firstLine.isEmpty ? '(no description)' : firstLine,", "firstLine.isEmpty ? (AppStrings.of(context).es ? '(sin descripción)' : '(no description)') : firstLine,"),
          ]
          for x,y in pairs:
            if block.count(x)!=1: raise SystemExit(f'matches {block.count(x)}')
            block=block.replace(x,y,1)
          p.write_text(s[:a]+block+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character card tooltips and fallback'
          git push origin HEAD:spanish-localization
