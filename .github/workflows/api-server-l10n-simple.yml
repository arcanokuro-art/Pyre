name: API server l10n simple
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          pos=s.index('Widget _serverBackedBody')
          tail=s[pos:]
          replacements=[
            ("const HowItWorksCard(\n          title: 'How connections work',", "HowItWorksCard(\n          title: AppStrings.of(context).es ? 'Cómo funcionan las conexiones' : 'How connections work',"),
            ("subtitle: 'Set once on the server — every device that connects uses it.',", "subtitle: AppStrings.of(context).es ? 'Configúralo una vez en el servidor: todos los dispositivos conectados lo usarán.' : 'Set once on the server — every device that connects uses it.',"),
            ("HowItWorksSection('Shared by the server', [", "HowItWorksSection(AppStrings.of(context).es ? 'Compartido por el servidor' : 'Shared by the server', ["),
          ]
          for old,new in replacements:
            if old not in tail: raise SystemExit('missing '+old[:35])
            tail=tail.replace(old,new,1)
          p.write_text(s[:pos]+tail)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize server API headings'
          git push origin HEAD:spanish-localization
