name: API test errors l10n 1
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          replacements={
          "const SnackBar(content: Text('Fill in the base URL first.'))":"SnackBar(content: Text(AppStrings.of(context).es ? 'Primero introduce la URL base.' : 'Fill in the base URL first.'))",
          "const SnackBar(\n        content: Text('That URL points at a private or internal address. '\n            'For a local server, set the type to Localhost.'))":"SnackBar(\n        content: Text(AppStrings.of(context).es\n            ? 'Esa URL apunta a una dirección privada o interna. Para un servidor local, establece el tipo en Localhost.'\n            : 'That URL points at a private or internal address. For a local server, set the type to Localhost.'))"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit('missing: '+old[:40])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API connection test errors'
          git push origin HEAD:spanish-localization
