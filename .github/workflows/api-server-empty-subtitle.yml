name: API server empty subtitle
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          pos=s.index("title: AppStrings.of(context).es ? 'Conecta un proveedor de IA'")
          h=s[:pos]; t=s[pos:]
          start=t.index('              subtitle:\n')
          end=t.index('              ctaLabel:', start)
          new="""              subtitle: AppStrings.of(context).es
                  ? 'Este servidor todavía no tiene IA. Añade un proveedor (OpenRouter tiene modelos gratuitos para empezar) y pega su clave API; se guardará en el servidor para todos los dispositivos que se conecten.'
                  : 'This server has no AI yet. Add one (OpenRouter has free models to start) and paste its API key — it\\'s saved on the server for every device that connects.',
"""
          t=t[:start]+new+t[end:]
          p.write_text(h+t)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize server empty-state explanation'
          git push origin HEAD:spanish-localization
