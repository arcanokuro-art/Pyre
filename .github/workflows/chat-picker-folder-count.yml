name: Chat picker folder count l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="                '$count character${count == 1 ? '' : 's'}',"
          new="                AppStrings.of(context).es ? '$count personaje${count == 1 ? '' : 's'}' : '$count character${count == 1 ? '' : 's'}',"
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize chat picker character count'
          git push origin HEAD:spanish-localization
