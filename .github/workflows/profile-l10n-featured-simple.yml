name: Profile featured simple
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text(); marker='  Widget build(BuildContext context) {\n'
          for cls in ['class _FeaturedCharacterCard','class _FeaturedPickerSheet']:
            pos=s.find(cls)
            if pos<0: raise SystemExit('missing '+cls)
            idx=s.find(marker,pos)
            if idx<0: raise SystemExit('missing build '+cls)
            if 'final es = AppStrings.of(context).es;' not in s[idx:idx+140]:
              s=s[:idx+len(marker)]+'    final es = AppStrings.of(context).es;\n'+s[idx+len(marker):]
          replacements=[
            ("                  'FEATURED CHARACTER',", "                  es ? 'PERSONAJE DESTACADO' : 'FEATURED CHARACTER',"),
            ("                  label: Text(character == null ? 'Pick' : 'Change'),", "                  label: Text(character == null ? (es ? 'Elegir' : 'Pick') : (es ? 'Cambiar' : 'Change')),"),
            ("                      'Pick a featured character',", "                      es ? 'Elige un personaje destacado' : 'Pick a featured character',"),
          ]
          for a,b in replacements:
            if a not in s: raise SystemExit('missing text '+a)
            s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize featured profile controls'
          git push origin HEAD:spanish-localization
