name: Creator final help
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart'); s=p.read_text()
          def repl(marker,new,kind):
            global s
            pos=s.index(marker); a=s.rfind(f'          HowItWorksBlock.{kind}(',0,pos); b=s.index('),\n',pos)+2; s=s[:a]+new+s[b:]
          repl("'Most people building cards", """          HowItWorksBlock.paragraph(es
              ? 'Muchas personas usan herramientas como esta para roleplay adulto. Pyre no decide por ti qué contenido crear: el resultado depende del modelo y del proveedor que elijas, y cada proveedor puede aplicar sus propias restricciones. Tú eliges tus proveedores y cómo utilizar tus tokens.'
              : 'Many people use tools like this for adult roleplay. Pyre does not decide what content you create: results depend on the model and provider you choose, and each provider may apply its own restrictions. You choose your providers and how to use your tokens.'),""",'paragraph')
          items=[
          ("'**\"The architect claimed",'**«El arquitecto dijo que una sección estaba terminada pero nunca escribió los datos estructurados de la tarjeta»** — el modelo está ignorando el formato de salida estructurada. Cambia a un modelo que siga mejor las instrucciones. Pyre reintentará automáticamente hasta 3 veces antes de mostrar esta advertencia.','**"The architect claimed a section was done but never wrote the structured card data"** — your model is ignoring structured-output discipline. Switch to a model that follows instructions better. Pyre will auto-retry up to 3 times before surfacing this warning.'),
          ("'**Card seems lobotomised",'**La tarjeta parece dañada después de una edición pequeña** — probablemente el modelo ignoró la regla de conservar todos los campos y reescribió demasiado. Cambia a un modelo que siga mejor las instrucciones.','**Card seems damaged after a small edit** — your model probably ignored the preserve-every-field rule and rewrote too much. Switch to a model that follows instructions better.'),
          ("'**Generating takes forever",'**La generación tarda demasiado o parece bloqueada** — las tarjetas largas pueden alcanzar entre 4k y 8k tokens. Aumenta «Tokens máximos del Creador» en los ajustes de generación. Si desapareció la notificación persistente, el sistema operativo pudo cerrar el servicio y tendrás que reiniciar la generación.','**Generating takes forever / hangs silently** — long cards can hit 4–8k tokens. Increase Creator max tokens in Generation settings. If the persistent notification disappeared, the OS may have killed the service and you will need to restart generation.'),
          ("'**Imported card got",'**Una tarjeta importada cambió de formato inesperadamente** — esto no debería ocurrir en Editar con IA, que intenta conservar las convenciones de formato existentes. Si el modelo normaliza el formato de todos modos, prueba otro modelo.','**Imported card got reformatted unexpectedly** — this should not happen in Edit-with-AI mode, which tries to preserve existing formatting conventions. If the model normalises it anyway, try another model.'),
          ("'**A field already filled",'**El arquitecto vuelve a rellenar un campo que ya estaba completo** — puede ser un bucle del modelo. Pulsa Reintentar una vez; si continúa, indícale explícitamente que avance a lo que todavía falta.','**A field already filled but the architect re-fills it** — this can be a confused model loop. Hit Retry once; if it persists, explicitly tell it to move on to what is still missing.')]
          for marker,es,en in items:
            repl(marker,f"          HowItWorksBlock.bullet(es\n              ? '{es}'\n              : '{en}'),",'bullet')
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator adult and troubleshooting help'
          git push origin HEAD:spanish-localization
