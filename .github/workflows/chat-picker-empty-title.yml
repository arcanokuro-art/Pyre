name: Character picker empty titles l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="          title: liveCount == 0\n              ? 'No characters yet'\n              : q.isNotEmpty\n                  ? 'No matches'\n                  : 'Every character is already in this chat',"
          new="          title: liveCount == 0\n              ? (AppStrings.of(context).es ? 'Aún no hay personajes' : 'No characters yet')\n              : q.isNotEmpty\n                  ? (AppStrings.of(context).es ? 'Sin coincidencias' : 'No matches')\n                  : (AppStrings.of(context).es ? 'Todos los personajes ya están en este chat' : 'Every character is already in this chat'),"
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize character picker empty titles'
          git push origin HEAD:spanish-localization
