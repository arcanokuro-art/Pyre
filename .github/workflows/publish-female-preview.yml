name: Publish female creator preview
on:
  push:
    branches: ['codex/female-character-creator']
    paths: ['.github/workflows/publish-female-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-female-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: arcanokuro-art/Pyre
        shell: bash
        run: |
          set -euo pipefail
          expected=88ac9ba49e2bc4d2679bdf75cb553a3427e00d9e
          actual="$(gh api repos/arcanokuro-art/Pyre/actions/runs/36829232908 --jq '.head_sha')"
          conclusion="$(gh api repos/arcanokuro-art/Pyre/actions/runs/36829232908 --jq '.conclusion')"
          test "$actual" = "$expected"
          test "$conclusion" = success
          gh api "repos/arcanokuro-art/Pyre/compare/$expected...$GITHUB_SHA" --jq '.files[].filename' > changed-files.txt
          if rg -v '^\\.github/workflows/' changed-files.txt; then
            echo "Refusing to tag code different from the verified APK" >&2
            exit 1
          fi
          gh run download 36829232908 -n Pyre-female-creator-preview-apk -D apk
          mv apk/app-debug.apk apk/Pyre-Creador-Femenino-Preview.apk
          sha256sum apk/Pyre-Creador-Femenino-Preview.apk > apk/SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Actualiza los modos rápida/detallada siguiendo los campos básicos y avanzados del HTML aportado el 1 de octubre. Conserva todos los valores guardados, Avatar, Lorebooks y la corrección de los cuadros rojos.
          
          Los campos y opciones del nuevo archivo coinciden con la ficha existente. No incluye el bloque interno de dinámica sexual explícita.
          
          Versión de prueba del creador femenino basada en el prototipo: 138 campos, relaciones, mensajes y recursos visuales. Avatar y Lorebooks conservan sus lugares.
          
          Descarga e instala Pyre-Creador-Femenino-Preview.apk. Esta versión se instala por separado de Pyre habitual.
          
          Código del APK: https://github.com/arcanokuro-art/Pyre/commit/88ac9ba49e2bc4d2679bdf75cb553a3427e00d9e. La etiqueta incluye además el flujo de publicación; el código de la app es idéntico al validado.
          
          Validación: análisis sin incidencias, 33 pruebas aprobadas y compilación Android correcta. Falta la prueba en dispositivo físico.
          
          Pendientes: creador masculino, integración del asistente de IA y bloques internos de dinámica.
          NOTES
          tag=pyre-female-creator-config-update1
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Pyre · Creador femenino — configuración actualizada" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Pyre · Creador femenino — configuración actualizada" --notes-file notes.md --prerelease --latest=false
          fi
          gh release upload "$tag" apk/Pyre-Creador-Femenino-Preview.apk apk/SHA256SUMS.txt --clobber

