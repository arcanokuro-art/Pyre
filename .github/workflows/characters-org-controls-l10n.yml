name: Characters org controls l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('class _OrgControlRow extends StatelessWidget')
          b=s.index('class _OrgChip extends StatelessWidget', a)
          block=s[a:b]
          block=block.replace('String _sortLabel(String key) {', 'String _sortLabel(BuildContext context, String key) {')
          pairs=[
            ("return 'Recently added';", "return AppStrings.of(context).es ? 'Añadidos recientemente' : 'Recently added';"),
            ("return 'Most chatted';", "return AppStrings.of(context).es ? 'Más usados en chats' : 'Most chatted';"),
            ("return 'Recently used';", "return AppStrings.of(context).es ? 'Usados recientemente' : 'Recently used';"),
            ("tooltip: 'Sort',", "tooltip: AppStrings.of(context).es ? 'Ordenar' : 'Sort',"),
            ("itemBuilder: (_) => const [\n              PopupMenuItem(value: 'recent', child: Text('Recently used')),\n              PopupMenuItem(value: 'created', child: Text('Recently added')),\n              PopupMenuItem(value: 'alpha', child: Text('A → Z')),\n              PopupMenuItem(value: 'chatted', child: Text('Most chatted')),\n            ],", "itemBuilder: (_) => [\n              PopupMenuItem(value: 'recent', child: Text(AppStrings.of(context).es ? 'Usados recientemente' : 'Recently used')),\n              PopupMenuItem(value: 'created', child: Text(AppStrings.of(context).es ? 'Añadidos recientemente' : 'Recently added')),\n              const PopupMenuItem(value: 'alpha', child: Text('A → Z')),\n              PopupMenuItem(value: 'chatted', child: Text(AppStrings.of(context).es ? 'Más usados en chats' : 'Most chatted')),\n            ],"),
            ("label: _sortLabel(store.charSortKey),", "label: _sortLabel(context, store.charSortKey),"),
            ("? 'Folders'\n                      : 'Folders (${store.folders.length})'", "? (AppStrings.of(context).es ? 'Carpetas' : 'Folders')\n                      : (AppStrings.of(context).es ? 'Carpetas (${store.folders.length})' : 'Folders (${store.folders.length})')"),
            ("? 'Folder ✕'", "? (AppStrings.of(context).es ? 'Carpeta ✕' : 'Folder ✕')"),
            ("? 'Tags'\n                  : 'Tags (${store.charSelectedTags.length})'", "? (AppStrings.of(context).es ? 'Etiquetas' : 'Tags')\n                  : (AppStrings.of(context).es ? 'Etiquetas (${store.charSelectedTags.length})' : 'Tags (${store.charSelectedTags.length})')"),
          ]
          for x,y in pairs:
            if block.count(x)!=1: raise SystemExit(f'matches {block.count(x)} for {x[:30]}')
            block=block.replace(x,y,1)
          p.write_text(s[:a]+block+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character organization controls'
          git push origin HEAD:spanish-localization
