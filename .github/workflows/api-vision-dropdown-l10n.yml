name: API vision dropdown l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          marker="child: Text('Same as creator provider')"
          pos=s.index(marker)
          start=s.rfind('const DropdownMenuItem<String?>(',0,pos)
          if start<0: raise SystemExit('item missing')
          s=s[:start]+s[start:].replace('const DropdownMenuItem<String?>(', 'DropdownMenuItem<String?>(',1)
          s=s.replace(marker,"child: Text(AppStrings.of(context).es ? 'Igual que el proveedor del creador' : 'Same as creator provider')",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize vision provider dropdown'
          git push origin HEAD:spanish-localization
