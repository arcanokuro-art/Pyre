name: Group picker member status l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="                          n == 0\n                              ? 'Pick at least one member'\n                              : n == 1\n                                  ? 'Just 1 member — a regular 1:1 chat'\n                                  : '$n members',"
          new="                          n == 0\n                              ? (AppStrings.of(context).es ? 'Elige al menos un miembro' : 'Pick at least one member')\n                              : n == 1\n                                  ? (AppStrings.of(context).es ? 'Solo 1 miembro — un chat 1:1 normal' : 'Just 1 member — a regular 1:1 chat')\n                                  : (AppStrings.of(context).es ? '$n miembros' : '$n members'),"
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize group picker member status'
          git push origin HEAD:spanish-localization
