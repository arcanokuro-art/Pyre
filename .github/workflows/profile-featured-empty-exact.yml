name: Profile featured empty exact
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          old="""editMode
                        ? 'Pin one of your characters as your '
                            'featured spotlight. It\\'s a pure curation '
                            'choice — no functional impact, just a way '
                            'to show off what you\\'re proud of.'
                        : 'No character pinned yet. Tap Edit to '
                            'pick one to spotlight here.',"""
          new="""editMode
                        ? (es
                            ? 'Fija uno de tus personajes como destacado. Es solo una elección de presentación: no tiene ningún efecto funcional, simplemente te permite mostrar uno de tus favoritos.'
                            : 'Pin one of your characters as your featured spotlight. It\\'s a pure curation choice — no functional impact, just a way to show off what you\\'re proud of.')
                        : (es
                            ? 'Todavía no hay ningún personaje fijado. Pulsa Editar para elegir uno y destacarlo aquí.'
                            : 'No character pinned yet. Tap Edit to pick one to spotlight here.'),"""
          if old not in s: raise SystemExit('exact block missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize featured empty messages'
          git push origin HEAD:spanish-localization
