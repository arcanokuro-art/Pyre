name: Profile featured empty edit
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          needle="'Pin one of your characters as your featured spotlight. It is only a presentation choice and has no functional effect.'"
          if needle not in s: raise SystemExit('marker missing')
          s=s.replace(needle,"es ? 'Fija uno de tus personajes como destacado. Es solo una elección de presentación y no tiene ningún efecto funcional.' : 'Pin one of your characters as your featured spotlight. It is only a presentation choice and has no functional effect.'",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize featured empty edit message'
          git push origin HEAD:spanish-localization
