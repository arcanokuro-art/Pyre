name: Creator l10n 2
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          s=s.replace("'➤  DeepSeek V4 Pro — by far the best. Other DeepSeek '\n              'family models (V3.2, V3 chat) also work well. Models '\n              'OUTSIDE the DeepSeek family tend to refuse or stumble '\n              'on NSFW card content, even with the addendum below.'", "AppStrings.of(context).es ? '➤  DeepSeek V4 Pro — con diferencia, el mejor. Otros modelos de la familia DeepSeek (V3.2, V3 chat) también funcionan bien. Los modelos FUERA de la familia DeepSeek tienden a rechazar o fallar con contenido NSFW de las tarjetas, incluso con los añadidos de abajo.' : '➤  DeepSeek V4 Pro — by far the best. Other DeepSeek family models (V3.2, V3 chat) also work well. Models OUTSIDE the DeepSeek family tend to refuse or stumble on NSFW card content, even with the addendum below.'",1)
          s=s.replace("'For Vision (image analysis when building cards):'", "AppStrings.of(context).es ? 'Para Visión (análisis de imágenes al crear tarjetas):' : 'For Vision (image analysis when building cards):'",1)
          s=s.replace("'➤  Qwen 3.6 Plus Uncensored — available on Venice and '\n              'NanoGPT. Best results for the clinical character '\n              'descriptions Pyre\\'s vision prompt asks for.'", "AppStrings.of(context).es ? '➤  Qwen 3.6 Plus Uncensored — disponible en Venice y NanoGPT. Ofrece los mejores resultados para las descripciones clínicas de personajes que solicita el prompt de visión de Pyre.' : '➤  Qwen 3.6 Plus Uncensored — available on Venice and NanoGPT. Best results for the clinical character descriptions Pyre\\'s vision prompt asks for.'",1)
          s=s.replace("'Set these in More → API Connections. The top card '\n                    'lets you override the Creator and Vision providers '\n                    'independently from the main chat provider.'", "AppStrings.of(context).es ? 'Configúralos en Más → Conexiones API. La tarjeta superior permite elegir proveedores distintos para Creador y Visión, independientemente del proveedor del chat principal.' : 'Set these in More → API Connections. The top card lets you override the Creator and Vision providers independently from the main chat provider.'",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Character Creator model recommendations'
          git push origin HEAD:spanish-localization
