name: Clean fallback and background l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          s=s.replace(") //\n                      'next one.'", ")", 1)
          a="? 'On — replies keep generating if you switch apps '"
          b="? (AppStrings.of(context).es ? 'Activado — las respuestas siguen generándose si cambias de aplicación (notificación silenciosa mientras está activo).' : 'On — replies keep generating if you switch apps (silent notification while active).') //"
          if a not in s: raise SystemExit('background on missing')
          s=s.replace(a,b,1)
          s=s.replace("//\n                      '(silent notification while active).'", "//", 1)
          a=": 'Off — switching apps mid-reply may drop the connection.',"
          b=": (AppStrings.of(context).es ? 'Desactivado — cambiar de aplicación durante una respuesta puede interrumpir la conexión.' : 'Off — switching apps mid-reply may drop the connection.'),"
          if a not in s: raise SystemExit('background off missing')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Clean fallback and localize background status'
          git push origin HEAD:spanish-localization
