name: Character avatar errors l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a="'This character has no avatar. Set one in the editor first, then re-export.'"
          b="AppStrings.of(context).es ? 'Este personaje no tiene avatar. Configura uno primero en el editor y vuelve a exportar.' : 'This character has no avatar. Set one in the editor first, then re-export.'"
          if a not in s: raise SystemExit('avatar text missing')
          s=s.replace(a,b,1).replace('        const SnackBar(\n            content: Text(\n                '+b+'))','        SnackBar(\n            content: Text(\n                '+b+'))',1)
          a='"Couldn\'t read the avatar image to embed in the card. Try setting a different avatar."'
          b="AppStrings.of(context).es ? 'No se pudo leer la imagen del avatar para incluirla en la tarjeta. Prueba con otro avatar.' : \"Couldn't read the avatar image to embed in the card. Try setting a different avatar.\""
          if a not in s: raise SystemExit('image text missing')
          s=s.replace(a,b,1).replace('        const SnackBar(\n            content: Text(\n                '+b+'))','        SnackBar(\n            content: Text(\n                '+b+'))',1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize avatar export warnings'
          git push origin HEAD:spanish-localization
