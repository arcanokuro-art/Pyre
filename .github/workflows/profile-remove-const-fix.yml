name: Profile remove const fix
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart')
          s=p.read_text()
          old="subtitle: const Text(\n                          es ? 'Oculta la tarjeta destacada de tu perfil.' : 'Hide the featured card from your profile.',\n                          style: TextStyle(fontSize: 11),\n                        ),"
          new="subtitle: Text(\n                          es ? 'Oculta la tarjeta destacada de tu perfil.' : 'Hide the featured card from your profile.',\n                          style: const TextStyle(fontSize: 11),\n                        ),"
          if old not in s:
              raise SystemExit('marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Fix localized profile subtitle const'
          git push origin HEAD:spanish-localization
