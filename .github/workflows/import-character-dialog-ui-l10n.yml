name: Character URL import dialog UI l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('Future<void> _showImportCharacterDialog')
          b=s.index('Future<void> _assertHostResolvesPublic',a)
          q=s[a:b]
          pairs=[
            ("title: const Text('Import character'),", "title: Text(AppStrings.of(ctx).es ? 'Importar personaje' : 'Import character'),"),
            ("'Paste a chub.ai / botbooru.com character page, or a direct '\n              'link to a Tavern Card v2 file (.png or .json) — e.g. a '\n              'catbox or pixeldrain link.',", "AppStrings.of(ctx).es\n                  ? 'Pega una página de personaje de chub.ai / botbooru.com o un enlace directo a un archivo Tavern Card v2 (.png o .json), por ejemplo de catbox o pixeldrain.'\n                  : 'Paste a chub.ai / botbooru.com character page, or a direct link to a Tavern Card v2 file (.png or .json) — e.g. a catbox or pixeldrain link.',"),
            ("child: const Text('Cancel'),", "child: Text(AppStrings.of(ctx).es ? 'Cancelar' : 'Cancel'),"),
          ]
          for x,y in pairs:
            if q.count(x)!=1: raise SystemExit(f'matches {q.count(x)}')
            q=q.replace(x,y,1)
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character URL import dialog UI'
          git push origin HEAD:spanish-localization
