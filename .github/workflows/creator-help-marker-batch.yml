name: Creator help marker batch
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          def replace_call(marker, new, kind='paragraph'):
              global s
              pos=s.index(marker)
              start=s.rfind(f'          HowItWorksBlock.{kind}(',0,pos)
              if start<0: raise SystemExit('start missing '+marker)
              # Calls here end at the next ), followed by newline; marker is inside concatenated strings.
              end=s.index('),\n',pos)+2
              s=s[:start]+new+s[end:]
          replace_call("'A scenario card covers", """          HowItWorksBlock.paragraph(es
              ? 'Una tarjeta de escenario cubre los mismos aspectos, pero orientados a un entorno: el mundo y sus reglas, el reparto de NPC, la escena inicial y el mismo cierre.'
              : 'A scenario card covers the same ground re-aimed at a setting: the world and its rules, the cast (NPCs), the opening scene, and the same wrap-up.'),""")
          replace_call("'The automatic build doesn", """          HowItWorksBlock.paragraph(es
              ? 'La creación automática no escribe saludos alternativos; puedes añadirlos manualmente en el editor después de guardar (Avanzado → Saludos alternativos).'
              : 'The automatic build does not write alternate greetings — you can add those by hand in the editor after saving (Advanced → Alternate greetings).'),""")
          replace_call("'Custom architect behaviour", """          HowItWorksBlock.bullet(es
              ? 'Comportamiento personalizado del arquitecto que quieras imponer. Estas reglas reemplazan los valores predeterminados del arquitecto.'
              : 'Custom architect behaviour you want enforced. These rules override the architect defaults.'),""", 'bullet')
          replace_call("'Your Profile \"About Me\"", """          HowItWorksBlock.paragraph(es
              ? 'El apartado «Acerca de mí» de tu perfil NO se envía al arquitecto: es una biografía local de la pantalla Perfil, no una entrada de contexto.'
              : 'Your Profile "About Me" is NOT sent to the architect — it is a local bio on the Profile screen, not a context input.'),""")
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator help blocks using stable markers'
          git push origin HEAD:spanish-localization
