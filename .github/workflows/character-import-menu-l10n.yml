name: Character import menu l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          pairs=[
          ("title: const Text('Create from scratch'),","title: Text(AppStrings.of(context).es ? 'Crear desde cero' : 'Create from scratch'),"),
          ("title: const Text('From URL'),","title: Text(AppStrings.of(context).es ? 'Desde URL' : 'From URL'),"),
          ("title: const Text('From file'),","title: Text(AppStrings.of(context).es ? 'Desde archivo' : 'From file'),"),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit('missing '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character import menu'
          git push origin HEAD:spanish-localization
