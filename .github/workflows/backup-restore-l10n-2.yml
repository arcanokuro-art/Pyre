name: Backup restore l10n 2
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/backup_restore_screen.dart')
          s=p.read_text()
          reps={
            "_catCheck(_catCharacters, 'Characters',":"_catCheck(_catCharacters, AppStrings.of(context).es ? 'Personajes' : 'Characters',",
            "_catCheck(_catPersonas, 'Personas',":"_catCheck(_catPersonas, 'Personas',",
            "_catCheck(_catChats, 'Chats',":"_catCheck(_catChats, 'Chats',",
            "_catCheck(_catLorebooks, 'Lorebooks',":"_catCheck(_catLorebooks, AppStrings.of(context).es ? 'Libros de lore' : 'Lorebooks',",
            "_catCheck(_catPresets, 'Presets',":"_catCheck(_catPresets, AppStrings.of(context).es ? 'Preajustes' : 'Presets',",
            "_catCheck(_catProviders, 'Connections',":"_catCheck(_catProviders, AppStrings.of(context).es ? 'Conexiones' : 'Connections',",
            "_catCheck(_catSettings, 'App settings',":"_catCheck(_catSettings, AppStrings.of(context).es ? 'Ajustes de la app' : 'App settings',",
            "_catCheck(_catCreatorSessions, 'Creator drafts',":"_catCheck(_catCreatorSessions, AppStrings.of(context).es ? 'Borradores del creador' : 'Creator drafts',",
          }
          for a,b in reps.items(): s=s.replace(a,b,1)
          s=s.replace("'${store.characters.length} cards · incl. avatars + gallery'", "AppStrings.of(context).es ? '${store.characters.length} tarjetas · incl. avatares + galería' : '${store.characters.length} cards · incl. avatars + gallery'",1)
          s=s.replace("'${store.personas.length} · incl. avatars'", "AppStrings.of(context).es ? '${store.personas.length} · incl. avatares' : '${store.personas.length} · incl. avatars'",1)
          s=s.replace("'${store.chats.length} conversations + memory'", "AppStrings.of(context).es ? '${store.chats.length} conversaciones + memoria' : '${store.chats.length} conversations + memory'",1)
          s=s.replace("'chat + creator prompt presets'", "AppStrings.of(context).es ? 'preajustes de chat + prompts del creador' : 'chat + creator prompt presets'",1)
          s=s.replace("'${store.providers.length} providers · ⚠ saved WITH your API keys in plain text'", "AppStrings.of(context).es ? '${store.providers.length} proveedores · ⚠ se guarda CON tus claves API en texto sin formato' : '${store.providers.length} providers · ⚠ saved WITH your API keys in plain text'",1)
          s=s.replace("'model / chat / memory / UI · regex rules · folders · profile'", "AppStrings.of(context).es ? 'modelo / chat / memoria / interfaz · reglas regex · carpetas · perfil' : 'model / chat / memory / UI · regex rules · folders · profile'",1)
          s=s.replace("'${store.creatorSessions.length} in progress'", "AppStrings.of(context).es ? '${store.creatorSessions.length} en progreso' : '${store.creatorSessions.length} in progress'",1)
          s=s.replace("const Text(\n                    'Import from SillyTavern',", "Text(\n                    AppStrings.of(context).es ? 'Importar desde SillyTavern' : 'Import from SillyTavern',",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/backup_restore_screen.dart
          git commit -m 'Localize Backup Restore categories and SillyTavern heading'
          git push origin HEAD:spanish-localization
