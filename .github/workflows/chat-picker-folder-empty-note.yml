name: Chat picker folder note l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="              'Everyone else lives inside a folder — open one above, or '\n              'search to look across all of them.',"
          new="              AppStrings.of(context).es\n                  ? 'Todos los demás están dentro de una carpeta; abre una arriba o busca para verlos en todas las carpetas.'\n                  : 'Everyone else lives inside a folder — open one above, or search to look across all of them.',"
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize chat picker folder note'
          git push origin HEAD:spanish-localization
