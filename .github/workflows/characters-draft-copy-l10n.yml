name: Characters draft copy l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          pairs=[
            ("'You have in-progress cards. Tap one to resume; long-press to delete.'", "AppStrings.of(context).es ? 'Tienes tarjetas en progreso. Toca una para continuar; mantén pulsado para eliminarla.' : 'You have in-progress cards. Tap one to resume; long-press to delete.'"),
            ("'Permanently discard \"$title\"? This cannot be undone.'", "AppStrings.of(context).es ? '¿Descartar permanentemente \"$title\"? Esta acción no se puede deshacer.' : 'Permanently discard \"$title\"? This cannot be undone.'"),
          ]
          changed=0
          for old,new in pairs:
            if old in s:
              s=s.replace(old,new,1); changed+=1
          if changed == 0: raise SystemExit('no draft copy found')
          # Remove const only on Text constructors that now contain AppStrings.
          s=s.replace('const Text(\n            AppStrings.of(context).es', 'Text(\n            AppStrings.of(context).es')
          s=s.replace('const Text(AppStrings.of(context).es', 'Text(AppStrings.of(context).es')
          p.write_text(s)
          print('changed',changed)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize remaining draft chooser copy'
          git push origin HEAD:spanish-localization
