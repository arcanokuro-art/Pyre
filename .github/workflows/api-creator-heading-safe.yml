name: API creator heading safe
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          marker="'Per-feature provider overrides'"
          pos=s.index(marker)
          row=s.rfind('            const Row(',0,pos)
          if row<0: raise SystemExit('row missing')
          s=s[:row]+s[row:].replace('            const Row(', '            Row(',1)
          s=s.replace(marker, "AppStrings.of(context).es ? 'Proveedores por función' : 'Per-feature provider overrides'",1)
          pos=s.index("AppStrings.of(context).es ? 'Proveedores por función'")
          style=s.index('                  style: TextStyle(',pos)
          s=s[:style]+s[style:].replace('                  style: TextStyle(', '                  style: const TextStyle(',1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize creator provider heading safely'
          git push origin HEAD:spanish-localization
