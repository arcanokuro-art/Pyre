name: Character drafts export l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          pairs=[
          ("              title: Text('Start fresh',","              title: Text(AppStrings.of(context).es ? 'Empezar de cero' : 'Start fresh',"),
          ("                'Create a brand-new card alongside your existing drafts.',","                AppStrings.of(context).es ? 'Crea una tarjeta nueva junto a tus borradores existentes.' : 'Create a brand-new card alongside your existing drafts.',"),
          ("        SnackBar(content: Text('Downloading $filename')),","        SnackBar(content: Text(AppStrings.of(context).es ? 'Descargando $filename' : 'Downloading $filename')),"),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit('missing '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize draft start and export download'
          git push origin HEAD:spanish-localization
