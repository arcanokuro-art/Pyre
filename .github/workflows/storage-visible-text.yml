name: Storage visible text

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/storage_screen.dart')
          s=p.read_text()
          s=s.replace("label: Text(\n                      'Clear library',", "label: Text(\n                      t('Borrar biblioteca', 'Clear library'),", 1)
          s=s.replace("const SnackBar(\n        content: Text(\n            'Snapshot saved. Previous state rotated into bak.0.'),\n        duration: Duration(seconds: 2),\n      )", "SnackBar(\n        content: Text(AppStrings.of(context).es ? 'Instantánea guardada. El estado anterior se movió a bak.0.' : 'Snapshot saved. Previous state rotated into bak.0.'),\n        duration: const Duration(seconds: 2),\n      )", 1)
          s=s.replace("const SnackBar(content: Text('Error log cleared.'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'Registro de errores borrado.' : 'Error log cleared.'))", 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/storage_screen.dart
          git commit -m 'Localize primary storage actions'
          git push origin HEAD:spanish-localization
