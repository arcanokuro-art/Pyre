name: Characters clear favorites l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          pairs=[
            ("label: const Text('Clear all', style: TextStyle(fontSize: 11)),", "label: Text(AppStrings.of(context).es ? 'Borrar todo' : 'Clear all', style: const TextStyle(fontSize: 11)),"),
            ("              'FAVORITES ($count)',", "              AppStrings.of(context).es ? 'FAVORITOS ($count)' : 'FAVORITES ($count)',"),
          ]
          for a,b in pairs:
            if s.count(a)<1: raise SystemExit(f'not found {a}')
            s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize clear tags and favorites heading'
          git push origin HEAD:spanish-localization
