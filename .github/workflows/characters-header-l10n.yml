name: Characters header l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          anchor="import '../models/models.dart';"
          if "../l10n/app_strings.dart" not in s:
            s=s.replace(anchor, "import '../l10n/app_strings.dart';\n"+anchor,1)
          s=s.replace("    final store = context.read<AppStore>();", "    final store = context.read<AppStore>();\n    final es = AppStrings.of(context).es;",1)
          replacements={
            "          2 => 'Lorebooks',":"          2 => es ? 'Libros de lore' : 'Lorebooks',",
            "          _ => 'Characters',":"          _ => es ? 'Personajes' : 'Characters',",
            "              label: const Text('Create'),":"              label: Text(es ? 'Crear' : 'Create'),",
            "                ButtonSegment(value: 0, label: Text('Characters ($charCount)'))":"                ButtonSegment(value: 0, label: Text('${es ? 'Personajes' : 'Characters'} ($charCount)'))",
            "                ButtonSegment(value: 2, label: Text('Lorebooks ($loreCount)'))":"                ButtonSegment(value: 2, label: Text('${es ? 'Libros de lore' : 'Lorebooks'} ($loreCount)'))",
            "                  1 => 'Search Persona',":"                  1 => es ? 'Buscar persona' : 'Search Persona',",
            "                  2 => 'Search Lorebook',":"                  2 => es ? 'Buscar libro de lore' : 'Search Lorebook',",
            "                  _ => 'Search Character',":"                  _ => es ? 'Buscar personaje' : 'Search Character',",
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit('missing: '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize characters library header'
          git push origin HEAD:spanish-localization
