name: Main update text only l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart'); s=p.read_text()
          old="        'Pyre ${info.latestVersion} is out'"
          new="        '${AppStrings.of(ctx).es ? 'Ya está disponible Pyre ${info.latestVersion}' : 'Pyre ${info.latestVersion} is out'}'"
          if old not in s: raise SystemExit('update text missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/main.dart
          git commit -m 'Localize update notification text'
          git push origin HEAD:spanish-localization
