name: API host key warning l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="""messenger.showSnackBar(const SnackBar(
        content: Text('You changed the host — enter a different API key (or '
            'clear it) before testing. Your saved key is never sent to a new '
            'host.')));"""
          new="""messenger.showSnackBar(SnackBar(
        content: Text(AppStrings.of(context).es
            ? 'Cambiaste el servidor; introduce una clave API diferente (o bórrala) antes de probar. Tu clave guardada nunca se envía a un servidor nuevo.'
            : 'You changed the host — enter a different API key (or clear it) before testing. Your saved key is never sent to a new host.')));"""
          if old not in s: raise SystemExit('warning missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API host key warning'
          git push origin HEAD:spanish-localization
