name: API advanced l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          pos=s.index('class _AdvancedFallbackTile'); h=s[:pos]; t=s[pos:]
          a="title: const Text('Advanced',\n            style: TextStyle(fontSize: 14, fontWeight: FontWeight.w600)),"
          b="title: Text(AppStrings.of(context).es ? 'Avanzado' : 'Advanced',\n            style: const TextStyle(fontSize: 14, fontWeight: FontWeight.w600)),"
          if a not in t: raise SystemExit('advanced')
          t=t.replace(a,b,1)
          p.write_text(h+t)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API advanced section'
          git push origin HEAD:spanish-localization
