name: Profile l10n 5
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          pos=s.index('class _TokenStat'); marker='  Widget build(BuildContext context) {\n'; idx=s.index(marker,pos); s=s[:idx]+s[idx:].replace(marker,marker+'    final es = AppStrings.of(context).es;\n',1)
          s=s.replace("          '~tokens',","          es ? '~tokens' : '~tokens',",1)
          pos=s.index('class _FeaturedCharacterCard'); idx=s.index(marker,pos); s=s[:idx]+s[idx:].replace(marker,marker+'    final es = AppStrings.of(context).es;\n',1)
          s=s.replace("                  'FEATURED CHARACTER',","                  es ? 'PERSONAJE DESTACADO' : 'FEATURED CHARACTER',",1)
          s=s.replace("                  label: Text(character == null ? 'Pick' : 'Change'),","                  label: Text(character == null ? (es ? 'Elegir' : 'Pick') : (es ? 'Cambiar' : 'Change')),",1)
          old="""                    editMode
                        ? 'Pin one of your characters as your '
                            'featured spotlight. It\\'s a pure curation '
                            'choice — no functional impact, just a way '
                            'to show off what you\\'re proud of.'
                        : 'No character pinned yet. Tap Edit to '
                            'pick one to spotlight here.',"""
          new="""                    editMode
                        ? (es ? 'Fija uno de tus personajes como destacado. Es solo una elección de presentación: no tiene ningún efecto funcional.' : 'Pin one of your characters as your featured spotlight. It\\'s a pure curation choice — no functional impact, just a way to show off what you\\'re proud of.')
                        : (es ? 'Todavía no hay ningún personaje fijado. Pulsa Editar para elegir uno y destacarlo aquí.' : 'No character pinned yet. Tap Edit to pick one to spotlight here.'),"""
          if old not in s: raise SystemExit('featured empty marker missing')
          s=s.replace(old,new,1)
          pos=s.index('class _FeaturedPickerSheet'); idx=s.index(marker,pos); s=s[:idx]+s[idx:].replace(marker,marker+'    final es = AppStrings.of(context).es;\n',1)
          s=s.replace("                      'Pick a featured character',","                      es ? 'Elige un personaje destacado' : 'Pick a featured character',",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize profile featured character section'
          git push origin HEAD:spanish-localization
