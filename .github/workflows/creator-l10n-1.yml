name: Creator l10n 1
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          s=s.replace("import '../models/models.dart';", "import '../models/models.dart';\nimport '../l10n/app_strings.dart';",1)
          s=s.replace("title: const Text('Creator settings'),", "title: Text(AppStrings.of(context).es ? 'Ajustes del creador' : 'Creator settings'),",1)
          s=s.replace("child: const Text('Clear additions'),", "child: Text(AppStrings.of(context).es ? 'Borrar añadidos' : 'Clear additions'),",1)
          s=s.replace("_SectionHeader('Architect prompt'),", "_SectionHeader(AppStrings.of(context).es ? 'Prompt del arquitecto' : 'Architect prompt'),",1)
          s=s.replace("'RECOMMENDED MODELS',", "AppStrings.of(context).es ? 'MODELOS RECOMENDADOS' : 'RECOMMENDED MODELS',",1)
          s=s.replace("'For the Character Creator (this screen):',", "AppStrings.of(context).es ? 'Para el Creador de personajes (esta pantalla):' : 'For the Character Creator (this screen):',",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Character Creator primary labels'
          git push origin HEAD:spanish-localization
