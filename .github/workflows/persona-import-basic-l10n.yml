name: Persona import basic l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          old="const SnackBar(content: Text('Could not read file bytes.'))"
          new="SnackBar(content: Text(AppStrings.of(context).es ? 'No se pudieron leer los datos del archivo.' : 'Could not read file bytes.'))"
          if old not in s: raise SystemExit('read error missing')
          s=s.replace(old,new,1)
          old="const SnackBar(content: Text('Import cancelled.'))"
          new="SnackBar(content: Text(AppStrings.of(context).es ? 'Importación cancelada.' : 'Import cancelled.'))"
          if old not in s: raise SystemExit('cancel missing')
          s=s.replace(old,new,1)
          old="SnackBar(content: Text('Import failed: $e'))"
          new="SnackBar(content: Text(AppStrings.of(context).es ? 'Error al importar: $e' : 'Import failed: $e'))"
          if old not in s: raise SystemExit('failure missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize basic persona import messages'
          git push origin HEAD:spanish-localization
