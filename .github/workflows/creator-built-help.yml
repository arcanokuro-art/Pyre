name: Creator built help
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          section=s.index("HowItWorksSection(es ? 'Qué se crea' : 'What gets built', [")
          next_section=s.index('        // 4.', section)
          # First paragraph
          a=s.index('          HowItWorksBlock.paragraph(',section)
          b=s.index('          HowItWorksBlock.bullet(',a)
          if 'architect fills' not in s[a:b]: raise SystemExit('intro validation failed')
          intro="""          HowItWorksBlock.paragraph(es
              ? 'No tienes que dirigir esta parte: el arquitecto completa toda la tarjeta en orden y deja el cierre (eslogan, notas del creador y etiquetas) para el final, de modo que pueda tomar en cuenta todo lo anterior. Una tarjeta de personaje incluye:'
              : 'You don\\'t drive any of this — the architect fills the whole card for you in order, saving the wrap-up (tagline, creator notes, tags) for last so it can reference everything that came before. A character card covers:'),
"""
          s=s[:a]+intro+s[b:]
          # Scenario paragraph after bullets, before next section comment
          section=s.index("HowItWorksSection(es ? 'Qué se crea' : 'What gets built', [")
          next_section=s.index('        // 4.', section)
          marker=s.index("'A scenario card covers",section,next_section)
          a=s.rfind('          HowItWorksBlock.paragraph(',section,marker)
          b=s.index('),',marker,next_section)+2
          scenario="""          HowItWorksBlock.paragraph(es
              ? 'Una tarjeta de escenario cubre los mismos aspectos, pero orientados a un entorno: premisa, reglas, mundo, reparto de NPC, estilo del narrador y apertura.'
              : 'A scenario card covers the same ground re-aimed at a setting: premise, rules, world, NPC cast, narrator style, and opening.'),"""
          s=s[:a]+scenario+s[b:]
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator built content help'
          git push origin HEAD:spanish-localization
