name: Creator flow marker
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          start=s.index('        // 0b. How a session flows')
          end=s.index('        // 1. Building modes', start)
          old=s[start:end]
          if '**Talk it out**' not in old: raise SystemExit('flow validation failed')
          new='''        // 0b. How a session flows (structured build — the old GREETING/\n        // BUILD-UP/GENERATE/REFINE phase model + "Generate" button were\n        // retired with the deterministic build).\n        HowItWorksSection(es ? 'Cómo transcurre una sesión' : 'How a session flows', [\n          HowItWorksBlock.paragraph(es\n              ? '1) **Habla sobre la idea** — cuéntale a la IA el concepto. Puede ser algo vago; hará algunas preguntas específicas. La ficha permanece vacía mientras conversan: todavía no se escribe nada.\\\\n\\\\n2) **Crear** — cuando la IA proponga crearla, o cuando tú estés listo, indícalo (o escribe /build). Entonces escribe TODA la tarjeta mediante varias pasadas automáticas.\\\\n\\\\n3) **Revisar** — la tarjeta terminada aparece campo por campo en el lienzo. Revísala y toca cualquier campo para editarlo manualmente.\\\\n\\\\n4) **Refinar o guardar** — sigue conversando para pedir cambios; la IA modifica solo lo que pediste y deja lo demás intacto, o guarda la tarjeta en tu biblioteca.'\n              : '1) **Talk it out** — tell the AI the vibe. Vague is fine; it asks a few targeted questions. The sheet stays empty while you chat.\\\\n\\\\n2) **Build** — when the AI proposes building, or any time you are ready, say the word (or type /build). It writes the whole card over a few automatic passes.\\\\n\\\\n3) **Review** — the finished card appears field-by-field in the canvas. Read it and edit any field by hand.\\\\n\\\\n4) **Refine or save** — keep chatting to ask for changes, or save it to your library.'),\n        ]),\n\n'''
          p.write_text(s[:start]+new+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator flow using stable comment markers'
          git push origin HEAD:spanish-localization
