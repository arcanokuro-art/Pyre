name: Persona import messages l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          pairs=[
          ("        const SnackBar(content: Text('Could not read file bytes.')),","        SnackBar(content: Text(AppStrings.of(context).es ? 'No se pudieron leer los datos del archivo.' : 'Could not read file bytes.')),"),
          ("      messenger.showSnackBar(const SnackBar(content: Text('Import cancelled.')));","      messenger.showSnackBar(SnackBar(content: Text(AppStrings.of(context).es ? 'Importación cancelada.' : 'Import cancelled.')));"),
          ("      SnackBar(content: Text('Imported persona \\"${persona.name}\\"')),","      SnackBar(content: Text(AppStrings.of(context).es ? 'Persona importada \\"${persona.name}\\"' : 'Imported persona \\"${persona.name}\\"')),"),
          ("      SnackBar(content: Text('Import failed: $e')),","      SnackBar(content: Text(AppStrings.of(context).es ? 'Error al importar: $e' : 'Import failed: $e')),"),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit('missing '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize persona import messages'
          git push origin HEAD:spanish-localization
