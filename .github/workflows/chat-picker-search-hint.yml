name: Character picker search hint l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="            decoration: const InputDecoration(\n              prefixIcon: Icon(Icons.search, size: 18),\n              hintText: 'Search characters…',\n              isDense: true,\n            ),"
          new="            decoration: InputDecoration(\n              prefixIcon: const Icon(Icons.search, size: 18),\n              hintText: AppStrings.of(context).es ? 'Buscar personajes…' : 'Search characters…',\n              isDense: true,\n            ),"
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize character picker search hint'
          git push origin HEAD:spanish-localization
