name: Profile remove title only
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          needle="const Text('Remove featured')"
          if needle not in s: raise SystemExit('marker missing')
          s=s.replace(needle,"Text(es ? 'Quitar destacado' : 'Remove featured')",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize remove featured title'
          git push origin HEAD:spanish-localization
