name: Persona list core l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('class _PersonaList extends StatelessWidget')
          b=s.index('class _PersonaFavHeaderItem', a)
          block=s[a:b]
          block=block.replace('String _sortLabel(String key) {','String _sortLabel(BuildContext context, String key) {',1)
          pairs=[
            ("return 'Recently added';", "return AppStrings.of(context).es ? 'Añadidas recientemente' : 'Recently added';"),
            ("return 'Recently used';", "return AppStrings.of(context).es ? 'Usadas recientemente' : 'Recently used';"),
            ("return const EmptyState(\n        icon: Icons.face_outlined,\n        title: 'No personas yet',\n        subtitle: 'Create a persona to define how you appear in chats.',\n      );", "return EmptyState(\n        icon: Icons.face_outlined,\n        title: AppStrings.of(context).es ? 'Aún no hay personas' : 'No personas yet',\n        subtitle: AppStrings.of(context).es ? 'Crea una persona para definir cómo apareces en los chats.' : 'Create a persona to define how you appear in chats.',\n      );"),
            ("tooltip: 'Sort',", "tooltip: AppStrings.of(context).es ? 'Ordenar' : 'Sort',"),
            ("itemBuilder: (_) => const [\n                  PopupMenuItem(value: 'recent', child: Text('Recently used')),\n                  PopupMenuItem(\n                      value: 'created', child: Text('Recently added')),\n                  PopupMenuItem(value: 'alpha', child: Text('A → Z')),\n                ],", "itemBuilder: (_) => [\n                  PopupMenuItem(value: 'recent', child: Text(AppStrings.of(context).es ? 'Usadas recientemente' : 'Recently used')),\n                  PopupMenuItem(value: 'created', child: Text(AppStrings.of(context).es ? 'Añadidas recientemente' : 'Recently added')),\n                  const PopupMenuItem(value: 'alpha', child: Text('A → Z')),\n                ],"),
            ("label: _sortLabel(store.personaSortKey),", "label: _sortLabel(context, store.personaSortKey),"),
            ("? const EmptyState(\n                  icon: Icons.search_off,\n                  title: 'No matches',\n                  subtitle: 'Nothing matches your search.',\n                )", "? EmptyState(\n                  icon: Icons.search_off,\n                  title: AppStrings.of(context).es ? 'Sin coincidencias' : 'No matches',\n                  subtitle: AppStrings.of(context).es ? 'Nada coincide con tu búsqueda.' : 'Nothing matches your search.',\n                )"),
          ]
          for x,y in pairs:
            if block.count(x)!=1: raise SystemExit(f'matches {block.count(x)}')
            block=block.replace(x,y,1)
          p.write_text(s[:a]+block+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize persona list core UI'
          git push origin HEAD:spanish-localization
