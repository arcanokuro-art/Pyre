name: API provider error hint l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old=": 'The provider returned an error.';"
          new=": (AppStrings.of(context).es ? 'El proveedor devolvió un error.' : 'The provider returned an error.');"
          if old not in s: raise SystemExit('provider error hint missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API provider error hint'
          git push origin HEAD:spanish-localization
