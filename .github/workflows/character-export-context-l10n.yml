name: Character export context l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a="""    final banner = galleryExported > 0
        ? 'Exported — ${file.uri.pathSegments.last} '
            '(+$galleryExported gallery ${galleryExported == 1 ? 'image' : 'images'})'
        : 'Exported — ${file.uri.pathSegments.last}';"""
          b="""    final es = AppStrings.of(context).es;
    final banner = galleryExported > 0
        ? (es
            ? 'Exportado — ${file.uri.pathSegments.last} (+$galleryExported ${galleryExported == 1 ? 'imagen' : 'imágenes'} de galería)'
            : 'Exported — ${file.uri.pathSegments.last} (+$galleryExported gallery ${galleryExported == 1 ? 'image' : 'images'})')
        : (es ? 'Exportado — ${file.uri.pathSegments.last}' : 'Exported — ${file.uri.pathSegments.last}');"""
          if s.count(a)!=1: raise SystemExit(f'banner matches {s.count(a)}')
          s=s.replace(a,b,1)
          marker="""      saveExtensions: const ['png'],
    );"""
          repl="""      saveExtensions: const ['png'],
      context: context,
    );"""
          if s.count(marker)<1: raise SystemExit('png deliver marker missing')
          s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character export delivery'
          git push origin HEAD:spanish-localization
