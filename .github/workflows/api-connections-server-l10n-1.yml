name: API server connections l10n 1
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          s=s.replace("        const HowItWorksCard(\n          title: 'How connections work',", "        HowItWorksCard(\n          title: AppStrings.of(context).es ? 'Cómo funcionan las conexiones' : 'How connections work',",1)
          s=s.replace("subtitle: 'Set once on the server — every device that connects uses it.',", "subtitle: AppStrings.of(context).es ? 'Configúralo una vez en el servidor: todos los dispositivos conectados lo usarán.' : 'Set once on the server — every device that connects uses it.',",1)
          s=s.replace("HowItWorksSection('Shared by the server', [", "HowItWorksSection(AppStrings.of(context).es ? 'Compartido por el servidor' : 'Shared by the server', [",1)
          old="""              HowItWorksBlock.paragraph(
                  'You\\'re connected to a self-host server. Its AI provider is '
                  'set here and shared by **every** device that connects — no '
                  'need to configure each browser.'),"""
          new="""              HowItWorksBlock.paragraph(AppStrings.of(context).es ? 'Estás conectado a un servidor autoalojado. Su proveedor de IA se configura aquí y se comparte con **todos** los dispositivos que se conecten; no es necesario configurar cada navegador.' : 'You\\'re connected to a self-host server. Its AI provider is set here and shared by **every** device that connects — no need to configure each browser.'),"""
          if old not in s: raise SystemExit('server paragraph missing')
          s=s.replace(old,new,1)
          s=s.replace("HowItWorksBlock.bullet(\n                  'The API key is stored on the server, never shown back.'),", "HowItWorksBlock.bullet(AppStrings.of(context).es ? 'La clave API se guarda en el servidor y nunca vuelve a mostrarse.' : 'The API key is stored on the server, never shown back.'),",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize server API connection explainer'
          git push origin HEAD:spanish-localization
