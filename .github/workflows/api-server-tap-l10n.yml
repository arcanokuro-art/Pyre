name: API server tap hint l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          pos=s.index('Widget _serverBackedBody'); h=s[:pos]; t=s[pos:]
          a="? 'Tap the connection (or +) to change the server\\'s provider.'"
          b="? (AppStrings.of(context).es ? 'Toca la conexión (o +) para cambiar el proveedor del servidor.' : 'Tap the connection (or +) to change the server\\'s provider.')"
          if a not in t: raise SystemExit('tap hint missing')
          t=t.replace(a,b,1)
          p.write_text(h+t)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize server provider tap hint'
          git push origin HEAD:spanish-localization
