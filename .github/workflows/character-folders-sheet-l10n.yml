name: Character folders sheet l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('Future<void> _showFoldersSheet')
          b=s.index('Future<String?> _promptFolderName',a)
          q=s[a:b]
          pairs=[
            ("'Folders',", "AppStrings.of(sheetCtx).es ? 'Carpetas' : 'Folders',"),
            ("'No folders yet. Create one to group characters.',", "AppStrings.of(sheetCtx).es ? 'Aún no hay carpetas. Crea una para agrupar personajes.' : 'No folders yet. Create one to group characters.',"),
            ("title: const Text('All characters'),", "title: Text(AppStrings.of(sheetCtx).es ? 'Todos los personajes' : 'All characters'),"),
            ("tooltip: 'Folder actions',", "tooltip: AppStrings.of(sheetCtx).es ? 'Acciones de carpeta' : 'Folder actions',"),
            ("title: 'Delete folder \"${f.name}\"?',", "title: AppStrings.of(sheetCtx).es ? '¿Eliminar la carpeta \"${f.name}\"?' : 'Delete folder \"${f.name}\"?',"),
            ("title: const Text('New folder'),", "title: Text(AppStrings.of(sheetCtx).es ? 'Nueva carpeta' : 'New folder'),"),
          ]
          for x,y in pairs:
            if q.count(x)!=1: raise SystemExit(f'matches {q.count(x)} for {x[:30]}')
            q=q.replace(x,y,1)
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character folders sheet'
          git push origin HEAD:spanish-localization
