name: Persona picker no persona l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          a="title: const Text('No persona'),"
          b="title: Text(AppStrings.of(context).es ? 'Sin persona' : 'No persona'),"
          c="'Send messages without a {{user}} identity.',"
          d="AppStrings.of(context).es ? 'Envía mensajes sin una identidad de {{user}}.' : 'Send messages without a {{user}} identity.',"
          if s.count(a)!=1 or s.count(c)!=1: raise SystemExit('unexpected targets')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize no persona option'
          git push origin HEAD:spanish-localization
