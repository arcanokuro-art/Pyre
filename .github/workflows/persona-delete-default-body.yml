name: Persona default delete warning l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart')
          s=p.read_text()
          old="""                    ? 'This is your default persona. After deleting, new chats '
                        'will have no default persona until you set another one. '
                        'Existing chats fall back to whichever persona was active '
                        'when they were created. Are you sure?'"""
          new="""                    ? (AppStrings.of(context).es
                        ? 'Esta es tu persona predeterminada. Después de eliminarla, los chats nuevos no tendrán una persona predeterminada hasta que establezcas otra. Los chats existentes usarán como alternativa la persona que estaba activa cuando fueron creados. ¿Seguro?'
                        : 'This is your default persona. After deleting, new chats will have no default persona until you set another one. Existing chats fall back to whichever persona was active when they were created. Are you sure?')"""
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize default persona deletion warning'
          git push origin HEAD:spanish-localization
