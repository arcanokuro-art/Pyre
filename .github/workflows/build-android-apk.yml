name: Build Android APK

on:
  push:
    branches:
      - spanish-localization
      - pyre-memory-1m-10m
      - pyre-chat-multimedia
      - codex/pyre-completo-es
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recuperar el APK para cambios exclusivos del comprobador
        id: prior_apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/pyre-completo-es'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if ! git fetch --quiet --no-tags --depth=1 origin "$PREVIOUS_SHA"; then exit 0; fi
          if ! git diff --quiet "$PREVIOUS_SHA" HEAD -- . ':(exclude).github/workflows/build-android-apk.yml'; then exit 0; fi
          run_id="$(gh run list --workflow build-android-apk.yml --commit "$PREVIOUS_SHA" \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -z "$run_id" ]; then exit 0; fi
          if gh run download "$run_id" --name Pyre-Android-x86_64 && [ -s Pyre-Android-x86_64.apk ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.prior_apk.outputs.reused != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.prior_apk.outputs.reused != 'true'
        run: flutter pub get

      - name: Verify final managed memory integration
        if: github.ref == 'refs/heads/pyre-memory-1m-10m'
        run: |
          grep -q "managedMemoryTokens" lib/models/models.dart
          grep -q "1M" lib/screens/long_term_memory_screen.dart
          grep -q "2M · Estándar" lib/screens/long_term_memory_screen.dart
          grep -q "10M" lib/screens/long_term_memory_screen.dart
          ! grep -q "Auto-checkpoint frequency" lib/screens/long_term_memory_screen.dart
          ! grep -q "Target words per checkpoint" lib/screens/long_term_memory_screen.dart
          ! grep -q "Summary Prompt" lib/screens/long_term_memory_screen.dart

      - name: Configure CI release signing
        if: steps.prior_apk.outputs.reused != 'true'
        env:
          PYRE_CI_KEYSTORE_B64: ${{ secrets.PYRE_ANDROID_KEYSTORE_B64 }}
          PYRE_CI_STORE_PASSWORD: ${{ secrets.PYRE_ANDROID_STORE_PASSWORD }}
          PYRE_CI_KEY_ALIAS: ${{ secrets.PYRE_ANDROID_KEY_ALIAS }}
          PYRE_CI_KEY_PASSWORD: ${{ secrets.PYRE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$PYRE_CI_KEYSTORE_B64" ] && [ -n "$PYRE_CI_STORE_PASSWORD" ] && [ -n "$PYRE_CI_KEY_ALIAS" ] && [ -n "$PYRE_CI_KEY_PASSWORD" ]; then
            echo "$PYRE_CI_KEYSTORE_B64" | base64 --decode > android/app/pyre-release.jks
            cat > android/key.properties <<EOF
          storePassword=$PYRE_CI_STORE_PASSWORD
          keyPassword=$PYRE_CI_KEY_PASSWORD
          keyAlias=$PYRE_CI_KEY_ALIAS
          storeFile=pyre-release.jks
          EOF
            echo "PYRE_SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Android release signing secrets are not configured; APK will use the ephemeral CI debug key and cannot update an existing install signed by a different runner."
            echo "PYRE_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APKs per ABI
        if: steps.prior_apk.outputs.reused != 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "codex/pyre-completo-es" ] && [ "$PYRE_SIGNING_MODE" != release ]; then
            PYRE_DEV=true flutter build apk --release --split-per-abi --dart-define=PYRE_DEV=true
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Verify APK signing mode
        if: steps.prior_apk.outputs.reused != 'true'
        run: |
          echo "Signing mode: $PYRE_SIGNING_MODE"
          if [ "$PYRE_SIGNING_MODE" != "release" ]; then
            echo "::warning::This build is installable as a fresh install, but Android may reject it as an update because CI debug signing keys are ephemeral."
          fi

      - name: Prepare downloadable APK names
        if: steps.prior_apk.outputs.reused != 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Pyre-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Pyre-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Pyre-Android-x86_64.apk

      - name: Upload ARM64 APK artifact
        if: steps.prior_apk.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pyre-Android-arm64-v8a
          path: Pyre-Android-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK artifact
        if: steps.prior_apk.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pyre-Android-armeabi-v7a
          path: Pyre-Android-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload x86_64 APK artifact
        if: steps.prior_apk.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pyre-Android-x86_64
          path: Pyre-Android-x86_64.apk
          if-no-files-found: error

      - name: Publish APKs as GitHub Release
        if: github.ref == 'refs/heads/pyre-memory-1m-10m' || github.ref == 'refs/heads/pyre-chat-multimedia'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name == 'pyre-chat-multimedia' && 'pyre-multimedia-latest' || 'pyre-memory-latest' }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" \
            Pyre-Android-arm64-v8a.apk \
            Pyre-Android-armeabi-v7a.apk \
            Pyre-Android-x86_64.apk \
            --title "${{ github.ref_name == 'pyre-chat-multimedia' && 'Pyre Android - Chat Multimedia' || 'Pyre Android - Managed Memory 1M 2M 10M' }}" \
            --notes "${{ github.ref_name == 'pyre-chat-multimedia' && 'APK de Pyre con multimedia de chat: adjuntar imágenes, visión y generación de escenas. Incluye la memoria administrada 1M / 2M / 10M. Para teléfonos Android ARM64 modernos, descarga Pyre-Android-arm64-v8a.apk.' || 'APK de Pyre con la configuración general de memoria 1M / 2M / 10M. 2M es el valor estándar. Para teléfonos Android ARM64 modernos, descarga Pyre-Android-arm64-v8a.apk.' }}"

      - name: Comprobar instalación y arranque en Android
        if: github.ref == 'refs/heads/codex/pyre-completo-es'
        timeout-minutes: 12
        run: |
          sudo chmod a+rw /dev/kvm
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?}}"
          sdk_manager="$(find -L "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$sdk_manager" ]; then
            tools_archive="$RUNNER_TEMP/android-tools.zip"
            tools_dir="$RUNNER_TEMP/pyre-sdk-tools"
            curl --fail --silent --show-error --retry 2 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              --output "$tools_archive"
            unzip -q "$tools_archive" -d "$tools_dir"
            sdk_manager="$tools_dir/cmdline-tools/bin/sdkmanager"
          fi
          "$sdk_manager" --sdk_root="$sdk" 'emulator' 'system-images;android-34;google_apis;x86_64'
          export ANDROID_HOME="$sdk"
          printf 'no\n' | "$(dirname "$sdk_manager")/avdmanager" create avd --name pyre-ci \
            --package 'system-images;android-34;google_apis;x86_64' --force
          export PATH="$sdk/platform-tools:$PATH"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd pyre-ci -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 240 adb wait-for-device
          for attempt in {1..60}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb install Pyre-Android-x86_64.apk
          package=app.pyre.client
          if adb shell pm path app.pyre.client.dev | grep -q '^package:'; then
            package=app.pyre.client.dev
          fi
          adb logcat -c
          adb shell am start -W -n "$package/com.example.emberchat.MainActivity" | tee startup.log
          grep -q 'Status: ok' startup.log
          sleep 5
          adb shell pidof "$package"
          adb shell dumpsys activity activities | grep -m1 "topResumedActivity.*$package"
          adb logcat -d -s AndroidRuntime:E > crashes.log
          if grep -q 'FATAL EXCEPTION' crashes.log; then cat crashes.log; exit 1; fi
