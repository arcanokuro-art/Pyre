name: Build Android APK

on:
  push:
    branches:
      - spanish-localization
      - pyre-memory-1m-10m
      - pyre-chat-multimedia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify final managed memory integration
        if: github.ref == 'refs/heads/pyre-memory-1m-10m'
        run: |
          grep -q "managedMemoryTokens" lib/models/models.dart
          grep -q "1M" lib/screens/long_term_memory_screen.dart
          grep -q "2M · Estándar" lib/screens/long_term_memory_screen.dart
          grep -q "10M" lib/screens/long_term_memory_screen.dart
          ! grep -q "Auto-checkpoint frequency" lib/screens/long_term_memory_screen.dart
          ! grep -q "Target words per checkpoint" lib/screens/long_term_memory_screen.dart
          ! grep -q "Summary Prompt" lib/screens/long_term_memory_screen.dart

      - name: Build release APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: Prepare downloadable APK names
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Pyre-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Pyre-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Pyre-Android-x86_64.apk

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyre-Android-arm64-v8a
          path: Pyre-Android-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyre-Android-armeabi-v7a
          path: Pyre-Android-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyre-Android-x86_64
          path: Pyre-Android-x86_64.apk
          if-no-files-found: error

      - name: Publish APKs as GitHub Release
        if: github.ref == 'refs/heads/pyre-memory-1m-10m' || github.ref == 'refs/heads/pyre-chat-multimedia'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name == 'pyre-chat-multimedia' && 'pyre-multimedia-latest' || 'pyre-memory-latest' }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" \
            Pyre-Android-arm64-v8a.apk \
            Pyre-Android-armeabi-v7a.apk \
            Pyre-Android-x86_64.apk \
            --title "${{ github.ref_name == 'pyre-chat-multimedia' && 'Pyre Android - Chat Multimedia' || 'Pyre Android - Managed Memory 1M 2M 10M' }}" \
            --notes "${{ github.ref_name == 'pyre-chat-multimedia' && 'APK de Pyre con multimedia de chat: adjuntar imágenes, visión y generación de escenas. Incluye la memoria administrada 1M / 2M / 10M. Para teléfonos Android ARM64 modernos, descarga Pyre-Android-arm64-v8a.apk.' || 'APK de Pyre con la configuración general de memoria 1M / 2M / 10M. 2M es el valor estándar. Para teléfonos Android ARM64 modernos, descarga Pyre-Android-arm64-v8a.apk.' }}"
