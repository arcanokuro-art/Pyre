name: API connections l10n 2b
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          s=s.replace("HowItWorksBlock.paragraph(\n                            'Pyre brings no AI of its own — it connects to a '\n                            'service that writes the replies (OpenRouter, '\n                            'OpenAI, a local model…). You add the service and '\n                            'paste **its** API key.'),", "HowItWorksBlock.paragraph(es ? 'Pyre no incluye una IA propia: se conecta a un servicio que escribe las respuestas (OpenRouter, OpenAI, un modelo local…). Añades el servicio y pegas **su** clave API.' : 'Pyre brings no AI of its own — it connects to a service that writes the replies (OpenRouter, OpenAI, a local model…). You add the service and paste **its** API key.'),",1)
          s=s.replace("HowItWorksBlock.paragraph(\n                            'Keys are kept in your device\\'s secure store, '\n                            'never leave the device, and are left out of '\n                            'backups unless you tick that box.'),", "HowItWorksBlock.paragraph(es ? 'Las claves se guardan en el almacenamiento seguro de tu dispositivo, nunca salen de él y no se incluyen en las copias de seguridad salvo que marques esa opción.' : 'Keys are kept in your device\\'s secure store, never leave the device, and are left out of backups unless you tick that box.'),",1)
          s=s.replace("HowItWorksBlock.bullet(\n                            '**Tap a connection** to make it the one your '\n                            'chats use (the CHAT badge moves to it).'),", "HowItWorksBlock.bullet(es ? '**Pulsa una conexión** para convertirla en la que usan tus chats (la insignia CHAT se moverá a ella).' : '**Tap a connection** to make it the one your chats use (the CHAT badge moves to it).'),",1)
          s=s.replace("HowItWorksBlock.bullet(\n                            '**The list is the fallback order** — if one '\n                            'fails or refuses, Pyre offers the next. Drag to '\n                            'reorder.'),", "HowItWorksBlock.bullet(es ? '**La lista define el orden alternativo**: si una conexión falla o rechaza la solicitud, Pyre ofrece la siguiente. Arrastra para reordenar.' : '**The list is the fallback order** — if one fails or refuses, Pyre offers the next. Drag to reorder.'),",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API connections explainer body'
          git push origin HEAD:spanish-localization
