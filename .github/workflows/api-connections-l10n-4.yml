name: API connections l10n 4
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="                                'model: ${p.model.isEmpty ? \"(none)\" : p.model}',"
          new="                                es ? 'modelo: ${p.model.isEmpty ? \"(ninguno)\" : p.model}' : 'model: ${p.model.isEmpty ? \"(none)\" : p.model}',"
          if old not in s: raise SystemExit('model label not found')
          s=s.replace(old,new,1)
          s=s.replace("label: 'CREATOR',", "label: es ? 'CREADOR' : 'CREATOR',",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize provider list metadata'
          git push origin HEAD:spanish-localization
