name: API creator label l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          marker="                'CREATOR',"
          pos=s.index(marker)
          pad=s.rfind('            const Padding(',0,pos)
          if pad<0: raise SystemExit('padding missing')
          s=s[:pad]+s[pad:].replace('            const Padding(', '            Padding(',1)
          s=s.replace('              padding: EdgeInsets.only(bottom: 4),','              padding: const EdgeInsets.only(bottom: 4),',1)
          s=s.replace(marker,"                AppStrings.of(context).es ? 'CREADOR' : 'CREATOR',",1)
          pos=s.index("AppStrings.of(context).es ? 'CREADOR' : 'CREATOR'")
          style=s.index('                style: TextStyle(',pos)
          s=s[:style]+s[style:].replace('                style: TextStyle(', '                style: const TextStyle(',1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize creator provider label'
          git push origin HEAD:spanish-localization
