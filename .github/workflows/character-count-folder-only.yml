name: Character folder count l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/characters_screen.dart')
          s = p.read_text()
          old = "                              '${f.characterIds.length} card${f.characterIds.length == 1 ? \"\" : \"s\"}',"
          new = "                              AppStrings.of(sheetCtx).es ? '${f.characterIds.length} tarjeta${f.characterIds.length == 1 ? \"\" : \"s\"}' : '${f.characterIds.length} card${f.characterIds.length == 1 ? \"\" : \"s\"}',"
          if s.count(old) != 1:
              raise SystemExit('target count=' + str(s.count(old)))
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize individual character folder count'
          git push origin HEAD:spanish-localization
