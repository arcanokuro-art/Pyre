name: Language setter final

on:
  push:
    branches:
      - spanish-localization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Insert setter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/state/app_store.dart')
          s = p.read_text()
          if 'void setLanguageCode(String code)' not in s:
              marker = '  /// Reorder a provider in the list'
              addition = "  /// Change the device-local UI language and persist it.\n  void setLanguageCode(String code) {\n    final normalized = code == 'en' ? 'en' : 'es';\n    if (uiPrefs.languageCode == normalized) return;\n    uiPrefs.languageCode = normalized;\n    _bump();\n  }\n\n"
              if marker not in s:
                  raise SystemExit('marker missing')
              p.write_text(s.replace(marker, addition + marker, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/state/app_store.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Persist language changes from settings'
            git push origin HEAD:spanish-localization
          fi
