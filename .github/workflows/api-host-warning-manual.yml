name: API host warning manual
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch warning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart')
          s=p.read_text()
          start=s.find("    messenger.showSnackBar(const SnackBar(\n        content: Text('You changed the host")
          if start < 0: raise SystemExit('start not found')
          end=s.find('    return;', start)
          if end < 0: raise SystemExit('end not found')
          replacement="""    messenger.showSnackBar(SnackBar(
        content: Text(AppStrings.of(context).es
            ? 'Cambiaste el host: introduce una clave API diferente (o bórrala) antes de probar. Tu clave guardada nunca se envía a un host nuevo.'
            : 'You changed the host — enter a different API key (or clear it) before testing. Your saved key is never sent to a new host.')));
"""
          p.write_text(s[:start]+replacement+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API changed-host warning'
          git push origin HEAD:spanish-localization
