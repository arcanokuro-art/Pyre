name: Character export context only
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          start=s.index('Future<void> _exportCharacterAsPng')
          end=s.index('Future<void> _exportCharacterAsJson', start)
          block=s[start:end]
          a="      saveExtensions: const ['png'],\n    );"
          b="      saveExtensions: const ['png'],\n      context: context,\n    );"
          if block.count(a)!=1: raise SystemExit(f'matches {block.count(a)}')
          block=block.replace(a,b,1)
          p.write_text(s[:start]+block+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Pass language context to character export'
          git push origin HEAD:spanish-localization
