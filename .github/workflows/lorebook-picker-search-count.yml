name: Lorebook picker search count l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          a="decoration: const InputDecoration(\n                prefixIcon: Icon(Icons.search, size: 18),\n                hintText: 'Search lorebooks…',"
          b="decoration: InputDecoration(\n                prefixIcon: const Icon(Icons.search, size: 18),\n                hintText: AppStrings.of(context).es ? 'Buscar libros de lore…' : 'Search lorebooks…',"
          c="'${l.entries.length} entries',"
          d="AppStrings.of(context).es ? '${l.entries.length} entradas' : '${l.entries.length} entries',"
          if s.count(a)!=1 or s.count(c)!=1: raise SystemExit('unexpected targets')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize lorebook picker search and count'
          git push origin HEAD:spanish-localization
