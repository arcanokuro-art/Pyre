name: API network error l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart')
          s=p.read_text()
          old="""    messenger.showSnackBar(SnackBar(
        content: Text('Couldn\\'t reach the server — check the URL and your '
            'connection. ($e)')));"""
          new="""    messenger.showSnackBar(SnackBar(
        content: Text(AppStrings.of(context).es
            ? 'No se pudo contactar con el servidor; comprueba la URL y tu conexión. ($e)'
            : 'Couldn\\'t reach the server — check the URL and your connection. ($e)')));"""
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API connection transport error'
          git push origin HEAD:spanish-localization
