name: API server l10n body
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          pos=s.index('Widget _serverBackedBody'); tail=s[pos:]
          old="""              HowItWorksBlock.paragraph(
                  'You\\'re connected to a self-host server. Its AI provider is '
                  'set here and shared by **every** device that connects — no '
                  'need to configure each browser.'),"""
          new="""              HowItWorksBlock.paragraph(AppStrings.of(context).es
                  ? 'Estás conectado a un servidor autoalojado. Su proveedor de IA se configura aquí y se comparte con **todos** los dispositivos que se conecten; no es necesario configurar cada navegador.'
                  : 'You\\'re connected to a self-host server. Its AI provider is set here and shared by **every** device that connects — no need to configure each browser.'),"""
          if old not in tail: raise SystemExit('paragraph missing')
          tail=tail.replace(old,new,1)
          old2="""              HowItWorksBlock.bullet(
                  'The API key is stored on the server, never shown back.'),"""
          new2="""              HowItWorksBlock.bullet(AppStrings.of(context).es
                  ? 'La clave API se guarda en el servidor y nunca vuelve a mostrarse.'
                  : 'The API key is stored on the server, never shown back.'),"""
          if old2 not in tail: raise SystemExit('bullet missing')
          tail=tail.replace(old2,new2,1)
          tail=tail.replace("'${s.baseUrl}\\nmodel: ${s.model}',", "AppStrings.of(context).es ? '${s.baseUrl}\\nmodelo: ${s.model}' : '${s.baseUrl}\\nmodel: ${s.model}',",1)
          p.write_text(s[:pos]+tail)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize server API body'
          git push origin HEAD:spanish-localization
