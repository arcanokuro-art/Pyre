name: Backup summary l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/backup_restore_screen.dart')
          s=p.read_text()
          s=s.replace("final replaceSummary = _replaceSummaryLines(store, blob);", "final replaceSummary = _replaceSummaryLines(store, blob, AppStrings.of(context).es);",1)
          s=s.replace("List<String> _replaceSummaryLines(AppStore s, Map<String, dynamic> raw) {", "List<String> _replaceSummaryLines(AppStore s, Map<String, dynamic> raw, bool es) {",1)
          s=s.replace("add('Characters', 'characters', s.characters.length);", "add(es ? 'Personajes' : 'Characters', 'characters', s.characters.length);",1)
          s=s.replace("add('Lorebooks', 'lorebooks', s.lorebooks.length);", "add(es ? 'Libros de lore' : 'Lorebooks', 'lorebooks', s.lorebooks.length);",1)
          s=s.replace("add('Presets', 'presets', s.presets.length);", "add(es ? 'Preajustes' : 'Presets', 'presets', s.presets.length);",1)
          s=s.replace("add('Connections', 'providers', s.providers.length);", "add(es ? 'Conexiones' : 'Connections', 'providers', s.providers.length);",1)
          s=s.replace("add('Creator drafts', 'creatorSessions', s.creatorSessions.length);", "add(es ? 'Borradores del creador' : 'Creator drafts', 'creatorSessions', s.creatorSessions.length);",1)
          s=s.replace("add('Regex rules', 'regexRules', s.regexRules.length);", "add(es ? 'Reglas regex' : 'Regex rules', 'regexRules', s.regexRules.length);",1)
          s=s.replace("add('Folders', 'folders', s.folders.length);", "add(es ? 'Carpetas' : 'Folders', 'folders', s.folders.length);",1)
          s=s.replace("lines.add('App settings');", "lines.add(es ? 'Ajustes de la app' : 'App settings');",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/backup_restore_screen.dart
          git commit -m 'Localize replacement category summary'
          git push origin HEAD:spanish-localization
