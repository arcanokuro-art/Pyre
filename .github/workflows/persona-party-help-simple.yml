name: Persona party help simple
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          a="              'Pick one to play solo, or several for a persona party. '"
          b="              AppStrings.of(context).es ? 'Elige una para jugar en solitario o varias para un grupo de personas. ' : 'Pick one to play solo, or several for a persona party. '"
          c="              'Uncheck everything for no persona. Only affects this chat.',"
          d="              + (AppStrings.of(context).es ? 'Desmarca todas para no usar ninguna persona. Solo afecta a este chat.' : 'Uncheck everything for no persona. Only affects this chat.'),"
          if s.count(a)!=1 or s.count(c)!=1: raise SystemExit('unexpected targets')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize persona party help safely'
          git push origin HEAD:spanish-localization
