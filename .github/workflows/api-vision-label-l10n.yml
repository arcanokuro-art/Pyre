name: API Vision label l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="Text('VISION'"
          new="Text(AppStrings.of(context).es ? 'VISIÓN' : 'VISION'"
          if old not in s: raise SystemExit('VISION label missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize Vision label'
          git push origin HEAD:spanish-localization
