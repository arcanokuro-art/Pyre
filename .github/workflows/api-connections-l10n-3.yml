name: API connections l10n 3
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="""                    child: Text(
                      'If a provider fails or refuses, Pyre offers to '
                      'switch to the next one. Drag to set the order — '
                      'the CHAT provider is always tried first.',
                      style: TextStyle("""
          new="""                    child: Text(
                      es ? 'Si un proveedor falla o rechaza la solicitud, Pyre ofrece cambiar al siguiente. Arrastra para establecer el orden; el proveedor CHAT siempre se prueba primero.' : 'If a provider fails or refuses, Pyre offers to switch to the next one. Drag to set the order — the CHAT provider is always tried first.',
                      style: TextStyle("""
          if old not in s: raise SystemExit('fallback guidance not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API fallback guidance'
          git push origin HEAD:spanish-localization
