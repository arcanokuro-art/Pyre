name: Characters favorites l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('class _ActiveTagChipsRow extends StatelessWidget')
          b=s.index('// ---------------------------------------------------------------------------', a)
          block=s[a:b]
          pairs=[
            ("label: const Text('Clear all', style: TextStyle(fontSize: 11)),", "label: Text(AppStrings.of(context).es ? 'Borrar todo' : 'Clear all', style: const TextStyle(fontSize: 11)),"),
            ("              'FAVORITES ($count)',", "              AppStrings.of(context).es ? 'FAVORITOS ($count)' : 'FAVORITES ($count)',"),
            ("? 'Remove from favorites'\n                  : 'Add to favorites',", "? (AppStrings.of(context).es ? 'Quitar de favoritos' : 'Remove from favorites')\n                  : (AppStrings.of(context).es ? 'Añadir a favoritos' : 'Add to favorites'),"),
          ]
          for x,y in pairs:
            if block.count(x)!=1: raise SystemExit(f'matches {block.count(x)}')
            block=block.replace(x,y,1)
          p.write_text(s[:a]+block+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character favorites controls'
          git push origin HEAD:spanish-localization
