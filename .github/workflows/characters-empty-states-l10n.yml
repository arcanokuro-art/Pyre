name: Characters empty states l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          start=s.index('class _CharacterList extends StatelessWidget')
          end=s.index('List<_CharItem> _buildItems', start)
          block=s[start:end]
          pairs=[
            ("return const EmptyState(\n        icon: Icons.person_outline,\n        title: 'No characters yet',\n        subtitle: 'Tap Create to import a Tavern Card from a URL or file.',\n      );", "return EmptyState(\n        icon: Icons.person_outline,\n        title: AppStrings.of(context).es ? 'Aún no hay personajes' : 'No characters yet',\n        subtitle: AppStrings.of(context).es\n            ? 'Toca Crear para importar una Tavern Card desde una URL o archivo.'\n            : 'Tap Create to import a Tavern Card from a URL or file.',\n      );"),
            ("title: 'No matches',", "title: AppStrings.of(context).es ? 'Sin coincidencias' : 'No matches',"),
            ("? 'Clear filters or change sort to see more.'\n                      : 'Nothing matches your search.',", "? (AppStrings.of(context).es ? 'Borra los filtros o cambia el orden para ver más.' : 'Clear filters or change sort to see more.')\n                      : (AppStrings.of(context).es ? 'Nada coincide con tu búsqueda.' : 'Nothing matches your search.'),"),
          ]
          for a,b in pairs:
            if block.count(a)!=1: raise SystemExit(f'matches {block.count(a)}')
            block=block.replace(a,b,1)
          p.write_text(s[:start]+block+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character list empty states'
          git push origin HEAD:spanish-localization
