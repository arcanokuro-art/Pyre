name: Localize desktop BotBooru
on:
  push:
    branches: [spanish-localization]
    paths: ['.github/workflows/localize-desktop-botbooru.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch visible desktop BotBooru strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/widgets/desktop_botbooru_webview.dart')
          s=p.read_text()
          s=s.replace("import '../services/attachment_store.dart';", "import '../l10n/app_strings.dart';\nimport '../services/attachment_store.dart';")
          s=s.replace("  String _currentUrl = '';", "  String _currentUrl = '';\n\n  bool get _es => AppStrings.of(context).es;\n  String _t(String es, String en) => _es ? es : en;")
          s=s.replace("widget.onCardError('Could not read the downloaded card.');", "widget.onCardError(_t('No se pudo leer la tarjeta descargada.', 'Could not read the downloaded card.'));" )
          s=s.replace("msg = 'Exported $exported '\n            '${exported == 1 ? 'card' : 'cards'} → opened the folder. '\n            \"Pick one in botbooru's upload dialog.\";", "msg = _es\n            ? 'Se exportaron $exported ${exported == 1 ? 'tarjeta' : 'tarjetas'} → se abrió la carpeta. Elige una en el diálogo de carga de BotBooru.'\n            : 'Exported $exported ${exported == 1 ? 'card' : 'cards'} → opened the folder. Pick one in botbooru\\'s upload dialog.';")
          s=s.replace("msg = 'No cards have an avatar yet — a card needs an image to '\n            'export. Set avatars in the editor, then try again. '\n            'Opened the (empty) folder anyway.';", "msg = _t('Ninguna tarjeta tiene avatar todavía; se necesita una imagen para exportarla. Configura los avatares en el editor y vuelve a intentarlo. Se abrió la carpeta vacía de todos modos.', 'No cards have an avatar yet — a card needs an image to export. Set avatars in the editor, then try again. Opened the (empty) folder anyway.');")
          s=s.replace("msg = 'No saved cards to export yet. Opened the folder anyway.';", "msg = _t('Todavía no hay tarjetas guardadas para exportar. Se abrió la carpeta de todos modos.', 'No saved cards to export yet. Opened the folder anyway.');")
          s=s.replace("showExportSnack(messenger, msg, null, visible: const Duration(seconds: 6));", "showExportSnack(messenger, msg, null, visible: const Duration(seconds: 6), spanish: _es);")
          s=s.replace("SnackBar(content: Text('Could not export cards: $e'))", "SnackBar(content: Text(_t('No se pudieron exportar las tarjetas: $e', 'Could not export cards: $e')))")
          s=s.replace("label: const Text('Back'),", "label: Text(_t('Atrás', 'Back')),")
          s=s.replace("tooltip: 'Browser back',", "tooltip: _t('Atrás en el navegador', 'Browser back'),")
          s=s.replace("tooltip: 'Browser forward',", "tooltip: _t('Adelante en el navegador', 'Browser forward'),")
          s=s.replace("tooltip: 'Reload',", "tooltip: _t('Recargar', 'Reload'),")
          s=s.replace("label: const Text('My cards'),", "label: Text(_t('Mis tarjetas', 'My cards')),")
          s=s.replace("label: const Text('Use this page for import'),", "label: Text(_t('Usar esta página para importar', 'Use this page for import')),")
          s=s.replace("'Starting embedded browser…'", "_t('Iniciando navegador integrado…', 'Starting embedded browser…')")
          s=s.replace("'Embedded browser unavailable'", "_t('Navegador integrado no disponible', 'Embedded browser unavailable')")
          s=s.replace("'Pyre uses Microsoft Edge WebView2 to embed '\n                  'botbooru.com inside the app. The runtime isn\\'t '\n                  'installed on this machine.'", "_t('Pyre usa Microsoft Edge WebView2 para integrar botbooru.com dentro de la aplicación. El entorno de ejecución no está instalado en este equipo.', 'Pyre uses Microsoft Edge WebView2 to embed botbooru.com inside the app. The runtime isn\\'t installed on this machine.')")
          s=s.replace("'Install the free Evergreen runtime from Microsoft, '\n                  'then relaunch Pyre:'", "_t('Instala el entorno de ejecución Evergreen gratuito de Microsoft y luego vuelve a iniciar Pyre:', 'Install the free Evergreen runtime from Microsoft, then relaunch Pyre:')")
          s=s.replace("'Error: $_initError'", "_t('Error: $_initError', 'Error: $_initError')")
          p.write_text(s)
          PY
          dart format lib/widgets/desktop_botbooru_webview.dart || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/widgets/desktop_botbooru_webview.dart
          git diff --cached --quiet || git commit -m 'Localize desktop BotBooru webview [skip ci]'
          git push
