name: Validate Spanish localization

on:
  push:
    branches: [spanish-localization]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/validate-spanish-localization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: spanish-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Report inherited formatting drift without hiding functional failures.
      - name: Report formatting drift
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # Keep this diagnostic non-blocking for now so the full test suite always
      # runs. The job still reports analyzer findings and tests remain blocking.
      - name: Static analysis
        continue-on-error: true
        run: flutter analyze

      # Functional tests are blocking; this also intentionally retriggers CI
      # after the responsive organization-chip fix.
      - name: Run tests
        run: flutter test
