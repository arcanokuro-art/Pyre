name: Character menu chat card l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('void _showCharacterMenu')
          b=s.index('void _showPersonaMenu', a)
          block=s[a:b]
          pairs=[
            ("_menuSectionLabel('Chat'),", "_menuSectionLabel(AppStrings.of(context).es ? 'Chat' : 'Chat'),"),
            ("title: const Text('Start new chat'),", "title: Text(AppStrings.of(context).es ? 'Iniciar chat nuevo' : 'Start new chat'),"),
            ("title: const Text('Start group chat'),", "title: Text(AppStrings.of(context).es ? 'Iniciar chat grupal' : 'Start group chat'),"),
            ("title: const Text('Continue chat'),", "title: Text(AppStrings.of(context).es ? 'Continuar chat' : 'Continue chat'),"),
            ("'Resume \"${c.name}\" — ${existingChat.messages.length} msgs.',", "AppStrings.of(context).es ? 'Reanudar \"${c.name}\" — ${existingChat.messages.length} mensajes.' : 'Resume \"${c.name}\" — ${existingChat.messages.length} msgs.',"),
            ("_menuSectionLabel('Card'),", "_menuSectionLabel(AppStrings.of(context).es ? 'Tarjeta' : 'Card'),"),
            ("title: const Text('View details'),", "title: Text(AppStrings.of(context).es ? 'Ver detalles' : 'View details'),"),
            ("title: const Text('Duplicate'),", "title: Text(AppStrings.of(context).es ? 'Duplicar' : 'Duplicate'),"),
            ("SnackBar(content: Text('Duplicated as \"${clone.name}\".')),", "SnackBar(content: Text(AppStrings.of(context).es ? 'Duplicado como \"${clone.name}\".' : 'Duplicated as \"${clone.name}\".')),"),
            ("title: const Text('Add as persona'),", "title: Text(AppStrings.of(context).es ? 'Añadir como persona' : 'Add as persona'),"),
            ("SnackBar(content: Text('Persona \"${p.name}\" created.')),", "SnackBar(content: Text(AppStrings.of(context).es ? 'Persona \"${p.name}\" creada.' : 'Persona \"${p.name}\" created.')),"),
          ]
          for x,y in pairs:
            if block.count(x)!=1: raise SystemExit(f'matches {block.count(x)} for {x[:35]}')
            block=block.replace(x,y,1)
          p.write_text(s[:a]+block+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character menu chat and card actions'
          git push origin HEAD:spanish-localization
