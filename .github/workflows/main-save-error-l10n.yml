name: Main save error l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart'); s=p.read_text()
          old='''        ScaffoldMessenger.of(ctx).showSnackBar(\n          const SnackBar(\n            duration: Duration(seconds: 8),\n            content: Text(\n                "Couldn't save your changes — check that the device isn't "\n                'out of storage. Your work is still here for now, but it '\n                'may not survive a restart until a save succeeds.'),\n          ),\n        );'''
          new='''        final es = AppStrings.of(ctx).es;\n        ScaffoldMessenger.of(ctx).showSnackBar(\n          SnackBar(\n            duration: const Duration(seconds: 8),\n            content: Text(es\n                ? 'No se pudieron guardar tus cambios; comprueba que el dispositivo tenga espacio disponible. Tu trabajo sigue aquí por ahora, pero podría perderse al reiniciar hasta que se complete un guardado correctamente.'\n                : "Couldn't save your changes — check that the device isn't out of storage. Your work is still here for now, but it may not survive a restart until a save succeeds."),\n          ),\n        );'''
          if old not in s: raise SystemExit('save warning marker missing')
          s=s.replace(old,new,1); p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/main.dart
          git commit -m 'Localize global save failure warning'
          git push origin HEAD:spanish-localization
