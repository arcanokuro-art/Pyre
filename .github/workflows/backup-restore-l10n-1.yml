name: Backup restore l10n 1
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/backup_restore_screen.dart')
          s=p.read_text()
          if "../l10n/app_strings.dart" not in s:
            s=s.replace("import '../models/models.dart';", "import '../l10n/app_strings.dart';\nimport '../models/models.dart';",1)
          s=s.replace("appBar: AppBar(title: const Text('Backup & Restore'))", "appBar: AppBar(title: Text(AppStrings.of(context).es ? 'Copia de seguridad y restauración' : 'Backup & Restore'))",1)
          s=s.replace("const Text(\n                    'Export',", "Text(\n                    AppStrings.of(context).es ? 'Exportar' : 'Export',",1)
          s=s.replace("'Save your data to a single JSON file. Pick what to '\n                    'include below. Avatars and gallery images are packed '\n                    'in, so the file fully restores on a new device (this '\n                    'makes it larger). Compatible with the HTML prototype '\n                    'backup format.'", "AppStrings.of(context).es ? 'Guarda tus datos en un único archivo JSON. Elige abajo qué incluir. Los avatares y las imágenes de la galería se incluyen para que el archivo pueda restaurarse por completo en un dispositivo nuevo (esto aumenta su tamaño). Compatible con el formato de copia de seguridad del prototipo HTML.' : 'Save your data to a single JSON file. Pick what to include below. Avatars and gallery images are packed in, so the file fully restores on a new device (this makes it larger). Compatible with the HTML prototype backup format.'",1)
          s=s.replace("const Text(\n                    'What to include',", "Text(\n                    AppStrings.of(context).es ? 'Qué incluir' : 'What to include',",1)
          for en,es in [('Share…','Compartir…'),('Copy','Copiar'),('Save','Guardar')]:
            s=s.replace(f"label: const Text('{en}')", f"label: Text(AppStrings.of(context).es ? '{es}' : '{en}')",1)
          s=s.replace("const Text(\n                    'Import',", "Text(\n                    AppStrings.of(context).es ? 'Importar' : 'Import',",1)
          s=s.replace("'Load a backup JSON. Only the categories present in the '\n                    'file are replaced — anything not in the backup is left '\n                    'untouched. (A full backup replaces everything.)'", "AppStrings.of(context).es ? 'Carga una copia de seguridad JSON. Solo se reemplazan las categorías presentes en el archivo; lo que no esté incluido permanece sin cambios. (Una copia completa reemplaza todo.)' : 'Load a backup JSON. Only the categories present in the file are replaced — anything not in the backup is left untouched. (A full backup replaces everything.)'",1)
          s=s.replace("label: const Text('Choose file…')", "label: Text(AppStrings.of(context).es ? 'Elegir archivo…' : 'Choose file…')",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/backup_restore_screen.dart
          git commit -m 'Localize primary Backup Restore UI'
          git push origin HEAD:spanish-localization
