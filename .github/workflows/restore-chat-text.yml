name: Restore chat text safely

on:
  push:
    branches: [spanish-localization]
    paths:
      - '.github/workflows/restore-chat-text.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
          fetch-depth: 0
      - name: Restore original behavior and localize fallback
        run: |
          git fetch origin main
          git show origin/main:lib/widgets/chat_text.dart > lib/widgets/chat_text.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/chat_text.dart')
          s = p.read_text()
          s = s.replace("import '../theme.dart';", "import '../l10n/app_strings.dart';\nimport '../theme.dart';", 1)
          s = s.replace('Widget _brokenInner() => Container(', 'Widget _brokenInner(BuildContext context) => Container(', 1)
          s = s.replace("alt.trim().isNotEmpty ? alt.trim() : 'image unavailable',", "alt.trim().isNotEmpty ? alt.trim() : (AppStrings.of(context).es ? 'imagen no disponible' : 'image unavailable'),", 1)
          s = s.replace('errorBuilder: (_, _, _) => _brokenInner(),', 'errorBuilder: (_, _, _) => _brokenInner(context),')
          s = s.replace('inner = _brokenInner();', 'inner = _brokenInner(context);')
          p.write_text(s)
          PY
      - name: Commit restored file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/chat_text.dart
          git commit -m 'Restore chat text behavior with localized image fallback'
          git push origin HEAD:spanish-localization
