name: Storage load status l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/storage_screen.dart')
          s=p.read_text()
          s=s.replace("final (color, icon, title) = _styleFor(result.status);", "final (color, icon, title) = _styleFor(result.status, AppStrings.of(context).es);",1)
          s=s.replace("(Color, IconData, String) _styleFor(LoadStatus s) {", "(Color, IconData, String) _styleFor(LoadStatus s, bool es) {",1)
          pairs={
            "'Loaded with warnings'":"es ? 'Cargado con advertencias' : 'Loaded with warnings'",
            "'Recovered from backup'":"es ? 'Recuperado desde la copia de seguridad' : 'Recovered from backup'",
            "'Partial salvage — some recent data may be lost'":"es ? 'Recuperación parcial; algunos datos recientes pueden haberse perdido' : 'Partial salvage — some recent data may be lost'",
            "'Load failed — raw file still on disk'":"es ? 'Falló la carga; el archivo original sigue en el dispositivo' : 'Load failed — raw file still on disk'",
            "'Fresh install'":"es ? 'Instalación nueva' : 'Fresh install'",
          }
          for a,b in pairs.items(): s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/storage_screen.dart
          git commit -m 'Localize storage load status titles'
          git push origin HEAD:spanish-localization
