name: Persona party status l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="""    final status = n == 0
        ? 'No persona'
        : n == 1
            ? 'Solo — 1 persona'
            : 'Persona party — $n personas (your messages = the whole group)';"""
          new="""    final status = n == 0
        ? (AppStrings.of(context).es ? 'Sin persona' : 'No persona')
        : n == 1
            ? (AppStrings.of(context).es ? 'Solo — 1 persona' : 'Solo — 1 persona')
            : (AppStrings.of(context).es
                ? 'Grupo de personas — $n personas (tus mensajes = todo el grupo)'
                : 'Persona party — $n personas (your messages = the whole group)');"""
          if s.count(old)!=1: raise SystemExit('target missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize persona party status'
          git push origin HEAD:spanish-localization
