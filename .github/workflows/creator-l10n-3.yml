name: Creator l10n 3
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/character_creator_screen.dart')
          s=p.read_text()
          s=s.replace("const Expanded(\n                  child: Text(\n                    'Your additions',", "Expanded(\n                  child: Text(\n                    AppStrings.of(context).es ? 'Tus añadidos' : 'Your additions',",1)
          s=s.replace("'Custom rules appended to the architect\\'s prompt. '\n              'Examples: \"Always respond in Brazilian Portuguese.\", '\n              '\"Keep appearances PG-13 unless I say otherwise.\", '\n              '\"Default scenarios to anime high-school settings.\"'", "AppStrings.of(context).es ? 'Reglas personalizadas que se añaden al prompt del arquitecto. Ejemplos: \"Responde siempre en portugués de Brasil.\", \"Mantén las apariencias en PG-13 salvo que indique lo contrario.\", \"Usa por defecto escenarios de instituto de anime.\"' : 'Custom rules appended to the architect\\'s prompt. Examples: \"Always respond in Brazilian Portuguese.\", \"Keep appearances PG-13 unless I say otherwise.\", \"Default scenarios to anime high-school settings.\"'",1)
          s=s.replace("decoration: const InputDecoration(\n                border: OutlineInputBorder(),\n                hintText:\n                    'Type extra rules / style guidelines / language '\n                    'preferences. Leave blank to run the architect '\n                    'exactly as shipped.',", "decoration: InputDecoration(\n                border: const OutlineInputBorder(),\n                hintText: AppStrings.of(context).es ? 'Escribe reglas adicionales, pautas de estilo o preferencias de idioma. Déjalo en blanco para ejecutar el arquitecto exactamente como viene configurado.' : 'Type extra rules / style guidelines / language preferences. Leave blank to run the architect exactly as shipped.',",1)
          s=s.replace("title: const Text('Generation settings',\n            style: TextStyle(fontWeight: FontWeight.w600)),", "title: Text(AppStrings.of(context).es ? 'Ajustes de generación' : 'Generation settings',\n            style: const TextStyle(fontWeight: FontWeight.w600)),",1)
          s=s.replace("'Sampling knobs for the Creator only (chat, image analysis, '\n          'sheet update). Defaults work for most setups.'", "AppStrings.of(context).es ? 'Controles de muestreo solo para el Creador (chat, análisis de imágenes y actualización de ficha). Los valores predeterminados funcionan en la mayoría de configuraciones.' : 'Sampling knobs for the Creator only (chat, image analysis, sheet update). Defaults work for most setups.'",1)
          s=s.replace("const Text('Description size',\n                    style: TextStyle(fontWeight: FontWeight.w600)),", "Text(AppStrings.of(context).es ? 'Tamaño de la descripción' : 'Description size',\n                    style: const TextStyle(fontWeight: FontWeight.w600)),",1)
          s=s.replace("'How long a Description the Creator writes for characters and '\n                  'personas. A soft target, not a cap — Standard matches Pyre\\'s '\n                  'default.'", "AppStrings.of(context).es ? 'Define qué tan larga será la descripción que el Creador escribe para personajes y personas. Es un objetivo aproximado, no un límite; Estándar coincide con el valor predeterminado de Pyre.' : 'How long a Description the Creator writes for characters and personas. A soft target, not a cap — Standard matches Pyre\\'s default.'",1)
          s=s.replace("segments: const [\n                      ButtonSegment(\n                          value: CreatorDescriptionSize.concise,\n                          label: Text('Concise')),\n                      ButtonSegment(\n                          value: CreatorDescriptionSize.standard,\n                          label: Text('Standard')),\n                      ButtonSegment(\n                          value: CreatorDescriptionSize.detailed,\n                          label: Text('Detailed')),\n                      ButtonSegment(\n                          value: CreatorDescriptionSize.veryDetailed,\n                          label: Text('Max')),\n                    ],", "segments: [\n                      ButtonSegment(value: CreatorDescriptionSize.concise, label: Text(AppStrings.of(context).es ? 'Concisa' : 'Concise')),\n                      ButtonSegment(value: CreatorDescriptionSize.standard, label: Text(AppStrings.of(context).es ? 'Estándar' : 'Standard')),\n                      ButtonSegment(value: CreatorDescriptionSize.detailed, label: Text(AppStrings.of(context).es ? 'Detallada' : 'Detailed')),\n                      ButtonSegment(value: CreatorDescriptionSize.veryDetailed, label: Text(AppStrings.of(context).es ? 'Máx.' : 'Max')),\n                    ],",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/character_creator_screen.dart
          git commit -m 'Localize Creator additions and generation settings'
          git push origin HEAD:spanish-localization
