name: Folder naming and tag picker l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('Future<String?> _promptFolderName')
          b=s.index('/// Sheet that pops from the kebab',a)
          q=s[a:b]
          pairs=[
            ("title: Text(initial.isEmpty ? 'New folder' : 'Rename folder'),", "title: Text(AppStrings.of(ctx).es ? (initial.isEmpty ? 'Nueva carpeta' : 'Renombrar carpeta') : (initial.isEmpty ? 'New folder' : 'Rename folder')),"),
            ("child: const Text('Cancel'),", "child: Text(AppStrings.of(ctx).es ? 'Cancelar' : 'Cancel'),"),
            ("child: const Text('Save'),", "child: Text(AppStrings.of(ctx).es ? 'Guardar' : 'Save'),"),
            ("const SnackBar(content: Text('No tags found on any character yet.')),", "SnackBar(content: Text(AppStrings.of(context).es ? 'Aún no se encontraron etiquetas en ningún personaje.' : 'No tags found on any character yet.')),"),
            ("'Filter by tags',", "AppStrings.of(sheetCtx).es ? 'Filtrar por etiquetas' : 'Filter by tags',"),
            ("child: const Text('Clear all'),", "child: Text(AppStrings.of(sheetCtx).es ? 'Borrar todo' : 'Clear all'),"),
            ("child: Text('Apply (${draft.length})'),", "child: Text(AppStrings.of(sheetCtx).es ? 'Aplicar (${draft.length})' : 'Apply (${draft.length})'),"),
          ]
          for x,y in pairs:
            if q.count(x)!=1: raise SystemExit(f'matches {q.count(x)} for {x[:35]}')
            q=q.replace(x,y,1)
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize folder naming and tag picker'
          git push origin HEAD:spanish-localization
