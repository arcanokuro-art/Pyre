name: API creator description l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="""            Text(
              'By default every call uses your active chat provider. Pin a '
              'different one here for the Creator or for image analysis — '
              'e.g. DeepSeek for chat and creator text, Qwen-VL only for '
              'vision. Vision falls back to creator → chat.',
              style: TextStyle("""
          new="""            Text(
              AppStrings.of(context).es
                  ? 'De forma predeterminada, cada llamada usa tu proveedor de chat activo. Fija aquí uno diferente para el Creador o para el análisis de imágenes; por ejemplo, DeepSeek para chat y texto del creador, y Qwen-VL solo para visión. Visión usa como respaldo creador → chat.'
                  : 'By default every call uses your active chat provider. Pin a different one here for the Creator or for image analysis — e.g. DeepSeek for chat and creator text, Qwen-VL only for vision. Vision falls back to creator → chat.',
              style: TextStyle("""
          if old not in s: raise SystemExit('creator description block missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize provider override description'
          git push origin HEAD:spanish-localization
