name: API network error l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="content: Text(\"Couldn't reach the server — check the URL and your connection. ($e)\")"
          new="content: Text(AppStrings.of(context).es ? 'No se pudo contactar con el servidor; comprueba la URL y tu conexión. ($e)' : \"Couldn't reach the server — check the URL and your connection. ($e)\")"
          if old not in s: raise SystemExit('network error snackbar missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API network error'
          git push origin HEAD:spanish-localization
