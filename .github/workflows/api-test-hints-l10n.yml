name: API HTTP test hints l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="""      final hint = (resp.statusCode == 401 || resp.statusCode == 403)
          ? 'The key was rejected — check you pasted the whole key.'
          : (resp.statusCode == 404)
              ? 'Nothing answered at this URL — check the Base URL.'
              : 'The provider returned an error.';"""
          new="""      final es = AppStrings.of(context).es;
      final hint = (resp.statusCode == 401 || resp.statusCode == 403)
          ? (es ? 'La clave fue rechazada; comprueba que pegaste la clave completa.' : 'The key was rejected — check you pasted the whole key.')
          : (resp.statusCode == 404)
              ? (es ? 'No hubo respuesta en esta URL; comprueba la URL base.' : 'Nothing answered at this URL — check the Base URL.')
              : (es ? 'El proveedor devolvió un error.' : 'The provider returned an error.');"""
          if old not in s: raise SystemExit('hint block missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API HTTP test hints'
          git push origin HEAD:spanish-localization
