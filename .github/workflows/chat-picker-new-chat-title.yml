name: Chat picker new chat title
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="""      builder: (_) => const CharacterPickerScreen(
        title: 'New chat',
        subtitle: 'Pick who to chat with.',
      ),"""
          new="""      builder: (_) => CharacterPickerScreen(
        title: AppStrings.of(context).es ? 'Chat nuevo' : 'New chat',
        subtitle: AppStrings.of(context).es ? 'Elige con quién chatear.' : 'Pick who to chat with.',
      ),"""
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize new chat picker title'
          git push origin HEAD:spanish-localization
