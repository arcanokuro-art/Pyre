name: API fallback subtitle safe
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          anchor="title: Text(AppStrings.of(context).es ? 'Cambio inteligente de proveedor'"
          pos=s.index(anchor); sub=s.index('            subtitle: Text(',pos); sty=s.index('              style: TextStyle(',sub)
          new="""            subtitle: Text(
              on
                  ? (AppStrings.of(context).es ? 'Activado — si un proveedor falla o rechaza la solicitud, Pyre ofrece el siguiente.' : 'On — if a provider fails or refuses, Pyre offers the next one.')
                  : (AppStrings.of(context).es ? 'Desactivado — una respuesta fallida simplemente muestra el error.' : 'Off — a failed reply just surfaces the error.'),
"""
          s=s[:sub]+new+s[sty:]
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize smart fallback status'
          git push origin HEAD:spanish-localization
