name: API feature text l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart')
          s=p.read_text()
          marker="              'By default every call uses your active chat provider. Pin a '"
          if s.count(marker)!=1: raise SystemExit('target count='+str(s.count(marker)))
          start=s.index(marker)
          end=s.index("              style: TextStyle(", start)
          old=s[start:end]
          new="""              AppStrings.of(context).es
                  ? 'De forma predeterminada, cada llamada usa tu proveedor de chat activo. Aquí puedes fijar uno diferente para el Creador o para el análisis de imágenes; por ejemplo, DeepSeek para chat y texto del creador, y Qwen-VL solo para visión. Visión usa como alternativa creador → chat.'
                  : 'By default every call uses your active chat provider. Pin a different one here for the Creator or for image analysis — e.g. DeepSeek for chat and creator text, Qwen-VL only for vision. Vision falls back to creator → chat.',
"""
          p.write_text(s[:start]+new+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API provider feature explanation safely'
          git push origin HEAD:spanish-localization
