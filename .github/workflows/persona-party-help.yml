name: Persona party help l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          old="""              'Pick one to play solo, or several for a persona party. '
              'Uncheck everything for no persona. Only affects this chat.',"""
          new="""              AppStrings.of(context).es
                  ? 'Elige una para jugar en solitario o varias para un grupo de personas. Desmarca todas para no usar ninguna persona. Solo afecta a este chat.'
                  : 'Pick one to play solo, or several for a persona party. Uncheck everything for no persona. Only affects this chat.',"""
          if s.count(old)!=1: raise SystemExit('target missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize persona party help text'
          git push origin HEAD:spanish-localization
