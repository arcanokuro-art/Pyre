name: Main import errors l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart'); s=p.read_text()
          # Keep the low-level fetch helper context-free; translate the known
          # errors only when they reach UI-capable code.
          old='''    } catch (_) {/* swallow — UI still works */}\n  });\n}'''
          new='''    } catch (e) {\n      final ctx = await _waitForNavContext();\n      if (ctx != null && ctx.mounted) {\n        final es = AppStrings.of(ctx).es;\n        final raw = e.toString();\n        final msg = raw.contains('link redirected to another address')\n            ? (es ? 'No se pudo importar: el enlace redirigió a otra dirección.' : "Couldn't import — the link redirected to another address.")\n            : raw.contains('file is too large')\n                ? (es ? 'No se pudo importar: el archivo es demasiado grande.' : "Couldn't import — file is too large.")\n                : (es ? 'No se pudo importar la tarjeta.' : "Couldn't import the card.");\n        ScaffoldMessenger.of(ctx).showSnackBar(SnackBar(\n          content: Text(msg),\n          duration: const Duration(seconds: 5),\n        ));\n      }\n    }\n  });\n}'''
          if old not in s: raise SystemExit('schedule import catch marker missing')
          s=s.replace(old,new,1); p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/main.dart
          git commit -m 'Localize capped card import errors'
          git push origin HEAD:spanish-localization
