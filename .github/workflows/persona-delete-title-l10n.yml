name: Persona delete title l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          a=s.index('void _showPersonaMenu')
          b=s.index('Future<void> _showImportCharacterDialog',a)
          q=s[a:b]
          q=q.replace("? 'Delete default persona \"${p.name}\"?'", "? (AppStrings.of(context).es ? '¿Eliminar la persona predeterminada \"${p.name}\"?' : 'Delete default persona \"${p.name}\"?')",1)
          q=q.replace(": 'Delete \"${p.name}\"?',", ": (AppStrings.of(context).es ? '¿Eliminar \"${p.name}\"?' : 'Delete \"${p.name}\"?'),",1)
          p.write_text(s[:a]+q+s[b:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize persona delete titles'
          git push origin HEAD:spanish-localization
