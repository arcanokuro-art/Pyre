name: Profile l10n 1
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          marker="import '../models/models.dart';"
          if "../l10n/app_strings.dart" not in s:
            s=s.replace(marker,"import '../l10n/app_strings.dart';\n"+marker,1)
          s=s.replace("    final store = context.watch<AppStore>();\n    final avatar", "    final store = context.watch<AppStore>();\n    final es = AppStrings.of(context).es;\n    final avatar",1)
          s=s.replace("        title: const Text('Profile'),", "        title: Text(es ? 'Perfil' : 'Profile'),",1)
          s=s.replace("            label: Text(_editMode ? 'Done' : 'Edit'),", "            label: Text(_editMode ? (es ? 'Listo' : 'Done') : (es ? 'Editar' : 'Edit')),",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize BotBooru profile header'
          git push origin HEAD:spanish-localization
