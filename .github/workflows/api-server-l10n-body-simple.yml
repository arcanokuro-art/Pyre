name: API server body simple
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          pos=s.index('Widget _serverBackedBody'); head=s[:pos]; t=s[pos:]
          a="HowItWorksBlock.paragraph(\n                  'You\\'re connected to a self-host server. Its AI provider is '\n                  'set here and shared by **every** device that connects — no '\n                  'need to configure each browser.')"
          b="HowItWorksBlock.paragraph(AppStrings.of(context).es ? 'Estás conectado a un servidor autoalojado. Su proveedor de IA se configura aquí y se comparte con **todos** los dispositivos que se conecten; no es necesario configurar cada navegador.' : 'You\\'re connected to a self-host server. Its AI provider is set here and shared by **every** device that connects — no need to configure each browser.')"
          if a not in t: raise SystemExit('p')
          t=t.replace(a,b,1)
          a="HowItWorksBlock.bullet(\n                  'The API key is stored on the server, never shown back.')"
          b="HowItWorksBlock.bullet(AppStrings.of(context).es ? 'La clave API se guarda en el servidor y nunca vuelve a mostrarse.' : 'The API key is stored on the server, never shown back.')"
          if a not in t: raise SystemExit('b')
          t=t.replace(a,b,1)
          a="'${s.baseUrl}\\nmodel: ${s.model}',"
          b="AppStrings.of(context).es ? '${s.baseUrl}\\nmodelo: ${s.model}' : '${s.baseUrl}\\nmodel: ${s.model}',"
          if a not in t: raise SystemExit('m')
          t=t.replace(a,b,1)
          p.write_text(head+t)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize server API body'
          git push origin HEAD:spanish-localization
