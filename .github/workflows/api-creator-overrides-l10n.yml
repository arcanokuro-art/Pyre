name: API creator overrides l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          s=s.replace("            const Row(\n", "            Row(\n", 1)
          s=s.replace("                  'Per-feature provider overrides',", "                  AppStrings.of(context).es ? 'Proveedores por función' : 'Per-feature provider overrides',", 1)
          s=s.replace("                  style: TextStyle(\n", "                  style: const TextStyle(\n", 1)
          old="""              'By default every call uses your active chat provider. Pin a '
              'different one here for the Creator or for image analysis — '
              'e.g. DeepSeek for chat and creator text, Qwen-VL only for '
              'vision. Vision falls back to creator → chat.',"""
          new="""              AppStrings.of(context).es
                  ? 'De forma predeterminada, cada solicitud usa tu proveedor activo de chat. Aquí puedes fijar uno distinto para el Creador o para el análisis de imágenes. Visión recurre al creador y después al chat.'
                  : 'By default every call uses your active chat provider. Pin a different one here for the Creator or for image analysis — e.g. DeepSeek for chat and creator text, Qwen-VL only for vision. Vision falls back to creator → chat.',"""
          if old not in s: raise SystemExit('description missing')
          s=s.replace(old,new,1)
          s=s.replace("            const Padding(\n              padding: EdgeInsets.only(bottom: 4),\n              child: Text(\n                'CREATOR',", "            Padding(\n              padding: const EdgeInsets.only(bottom: 4),\n              child: Text(\n                AppStrings.of(context).es ? 'CREADOR' : 'CREATOR',", 1)
          s=s.replace("                style: TextStyle(\n                  color: Colors.amber,", "                style: const TextStyle(\n                  color: Colors.amber,", 1)
          s=s.replace("                const DropdownMenuItem<String?>(\n                  value: null,\n                  child: Text('Same as chat provider'),", "                DropdownMenuItem<String?>(\n                  value: null,\n                  child: Text(AppStrings.of(context).es ? 'Igual que el proveedor de chat' : 'Same as chat provider'),", 1)
          s=s.replace("                const DropdownMenuItem<String?>(\n                  value: null,\n                  child: Text('Same as creator provider'),", "                DropdownMenuItem<String?>(\n                  value: null,\n                  child: Text(AppStrings.of(context).es ? 'Igual que el proveedor del creador' : 'Same as creator provider'),", 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize creator provider overrides'
          git push origin HEAD:spanish-localization
