name: API URL not found hint l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart'); s=p.read_text()
          old="? 'Nothing answered at this URL — check the Base URL.'"
          new="? (AppStrings.of(context).es ? 'No hubo respuesta en esta URL; comprueba la URL base.' : 'Nothing answered at this URL — check the Base URL.')"
          if old not in s: raise SystemExit('404 hint missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API URL not found hint'
          git push origin HEAD:spanish-localization
