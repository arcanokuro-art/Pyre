name: API vision heading l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/api_connections_screen.dart')
          s=p.read_text()
          old="""            const Padding(
              padding: EdgeInsets.only(bottom: 4),
              child: Text(
                'VISION',
                style: TextStyle(
                  color: Color(0xFF6FBEFF),"""
          new="""            Padding(
              padding: const EdgeInsets.only(bottom: 4),
              child: Text(
                AppStrings.of(context).es ? 'VISIÓN' : 'VISION',
                style: const TextStyle(
                  color: Color(0xFF6FBEFF),"""
          if s.count(old)!=1: raise SystemExit('target count='+str(s.count(old)))
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/api_connections_screen.dart
          git commit -m 'Localize API vision heading'
          git push origin HEAD:spanish-localization
