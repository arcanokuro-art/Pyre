name: Final Managed Memory Integration

on:
  push:
    branches:
      - pyre-memory-1m-10m
    paths:
      - .github/workflows/managed-memory-final-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pyre-memory-1m-10m
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Decouple checkpoint engine from removed legacy settings
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/services/memory.dart')
          s = p.read_text()

          old_threshold = '''  final threshold = memorySettings != null && memorySettings.autoEvery > 0
      ? memorySettings.autoEvery
      : _summarizeThreshold;'''
          assert old_threshold in s
          s = s.replace(old_threshold, '''  // Checkpoint cadence is now an internal implementation detail. The user-facing
  // memory configuration is exclusively the managed 1M / 2M / 10M capacity.
  final threshold = _summarizeThreshold;''', 1)

          old_kill = '''  } else if (memorySettings != null && memorySettings.autoEvery == 0) {
    fire = false;
  } else {'''
          assert old_kill in s
          s = s.replace(old_kill, '''  } else {''', 1)

          old_words = '''  final words =
      ((memorySettings?.memoryLimit ?? 1000).clamp(50, 5000) ~/ 1).toString();'''
          assert old_words in s
          s = s.replace(old_words, '''  // Summary size is internal and intentionally independent of historical
  // managed-memory capacity. Never reinterpret 1M/2M/10M as one recap size.
  const words = '1000';''', 1)

          old_body = '''  final body = (memorySettings != null &&
          memorySettings.summaryPrompt.trim().isNotEmpty)
      ? memorySettings.summaryPrompt
      : MemorySettings().summaryPrompt; // == _defaultPrompt arc framing'''
          assert old_body in s
          default_prompt = '''You are maintaining long-term memory for an ongoing roleplay. Summarize ONLY events that already happened in the supplied messages. Preserve important facts, relationships, character decisions, promises, conflicts, discoveries, locations, possessions, injuries, emotional changes, and unresolved threads. Do not continue the scene, invent dialogue, or add new events. Write concise flowing narrative prose in past tense. Aim for at most {{words}} words.'''
          s = s.replace(old_body, '''  const body = ''' + repr(default_prompt) + ''';''', 1)

          # Remove stale documentation references to deleted public settings.
          s = s.replace('/// [MemorySettings.summaryPrompt] when provided (with `{{words}}`\n/// substitution); otherwise falls back to a sensible default tuned for\n/// the new checkpoint paradigm.\n', '/// Uses Pyre’s internal checkpoint recap prompt. The public memory setting is\n/// exclusively the managed historical capacity (1M / 2M / 10M).\n')
          s = s.replace('  /// The effective fire threshold (resolved from `autoEvery` or the\n  /// `_summarizeThreshold` default).\n', '  /// The internal checkpoint fire threshold.\n')
          s = s.replace('  // Preserve the exact short-circuits of the original boolean: memory off\n  // OR autoEvery==0 kill-switch ⇒ false, regardless of the counts.\n', '  // Per-chat memory can still disable checkpointing; cadence itself is internal.\n')
          s = s.replace('  // Soft cap: convert memoryLimit (lines, loosely "words") into a word\n  // budget the template can interpolate via `{{words}}`.\n', '')

          # The function parameter remains temporarily for call-site compatibility,
          # but no removed legacy field may be read from it.
          for legacy in ('memorySettings.autoEvery', 'memorySettings.memoryLimit', 'memorySettings.summaryPrompt', 'MemorySettings().summaryPrompt'):
              assert legacy not in s, legacy

          p.write_text(s)
          PY

      - name: Verify managed memory replacement invariants
        run: |
          grep -q "managedMemoryTokens" lib/models/models.dart
          grep -q "1M" lib/screens/long_term_memory_screen.dart
          grep -q "2M · Estándar" lib/screens/long_term_memory_screen.dart
          grep -q "10M" lib/screens/long_term_memory_screen.dart
          ! grep -q "memorySettings.autoEvery" lib/services/memory.dart
          ! grep -q "memorySettings.memoryLimit" lib/services/memory.dart
          ! grep -q "memorySettings.summaryPrompt" lib/services/memory.dart
          ! grep -q "MemorySettings().summaryPrompt" lib/services/memory.dart

      - name: Format
        run: dart format lib/services/memory.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze complete project
        run: flutter analyze

      - name: Run managed memory tests
        run: flutter test test/managed_memory_settings_test.dart test/managed_memory_controller_test.dart test/managed_memory_app_store_adapter_test.dart test/managed_memory_release_readiness_test.dart

      - name: Compile release APKs as final gate
        run: flutter build apk --release --split-per-abi

      - name: Commit engine decoupling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/memory.dart
          if ! git diff --cached --quiet; then
            git commit -m "Decouple memory engine from legacy settings"
            git push origin HEAD:pyre-memory-1m-10m
          fi
