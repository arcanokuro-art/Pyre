name: Characters add subtitles l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          pairs=[
          ("          'Name the book, then add keyword-triggered entries yourself.',","          AppStrings.of(context).es ? 'Ponle un nombre al libro y después añade tú mismo entradas activadas por palabras clave.' : 'Name the book, then add keyword-triggered entries yourself.',"),
          ("          'Pick a SillyTavern World Info / lorebook JSON from your device.',","          AppStrings.of(context).es ? 'Elige en tu dispositivo un JSON de World Info / libro de lore de SillyTavern.' : 'Pick a SillyTavern World Info / lorebook JSON from your device.',"),
          ("          'Fill in the persona fields yourself in the in-app editor.',","          AppStrings.of(context).es ? 'Completa tú mismo los campos de la persona en el editor de la aplicación.' : 'Fill in the persona fields yourself in the in-app editor.',"),
          ("          'Pick a character card PNG/JSON or a Pyre persona JSON from your device.',","          AppStrings.of(context).es ? 'Elige en tu dispositivo una tarjeta de personaje PNG/JSON o un JSON de persona de Pyre.' : 'Pick a character card PNG/JSON or a Pyre persona JSON from your device.',"),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit('missing '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize library add menu descriptions'
          git push origin HEAD:spanish-localization
