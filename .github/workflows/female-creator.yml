name: Female character creator checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/female-creator.yml'
  push:
    branches: ['codex/female-character-creator']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed creator and attachment code
        run: >-
          flutter analyze --no-pub
          lib/services/female_character_profile.dart
          lib/services/female_character_schema.dart
          lib/widgets/female_character_form.dart
          lib/screens/character_edit_screen.dart
          lib/screens/characters_screen.dart
          lib/services/attachment_refs.dart
          lib/services/sync_engine.dart
          test/female_character_profile_test.dart
          test/female_character_form_test.dart
      - name: Test persistence, phone layout, existing cards and attachments
        run: >-
          flutter test --no-pub
          test/female_character_profile_test.dart
          test/female_character_form_test.dart
          test/character_folder_visibility_test.dart
          test/incoming_record_refs_test.dart
  android-preview:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK preview
        env:
          PYRE_DEV: '1'
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Pyre-female-creator-preview-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
