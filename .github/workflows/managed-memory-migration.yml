name: Managed memory migration

'on':
  push:
    branches:
      - pyre-memory-1m-10m
    paths:
      - .github/workflows/managed-memory-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-memory-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pyre-memory-1m-10m
          fetch-depth: 0

      - name: Patch legacy memory references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/services/memory.dart")
          s = p.read_text()

          s = s.replace("""  final threshold = memorySettings != null && memorySettings.autoEvery > 0
      ? memorySettings.autoEvery
      : _summarizeThreshold;""", """  final threshold = _summarizeThreshold;""", 1)

          s = s.replace("""  } else if (memorySettings != null && memorySettings.autoEvery == 0) {
    fire = false;
  } else {""", """  } else {""", 1)

          s = s.replace("""  final words =
      ((memorySettings?.memoryLimit ?? 1000).clamp(50, 5000) ~/ 1).toString();""", """  const words = '1000';""", 1)

          start = s.index("  final body = (memorySettings != null &&")
          end = s.index("  // Wave CY.18.209:", start)
          fixed = """  const body = 'You are maintaining long-term memory for an ongoing roleplay. '
      'Summarize ONLY events that already happened in the supplied messages. '
      'Preserve important facts, relationships, character decisions, promises, '
      'conflicts, discoveries, locations, possessions, injuries, emotional '
      'changes, and unresolved threads. Do not continue the scene, invent '
      'dialogue, or add new events. Write concise flowing narrative prose in '
      'past tense. Aim for at most {{words}} words.';

"""
          s = s[:start] + fixed + s[end:]

          forbidden = [
              "memorySettings.autoEvery",
              "memorySettings.memoryLimit",
              "memorySettings.summaryPrompt",
              "MemorySettings().summaryPrompt",
          ]
          left = [x for x in forbidden if x in s]
          if left:
              raise SystemExit("Legacy references remain: " + ", ".join(left))
          if "applyCheckpointWithManagedRetention(chat, c);" not in s:
              raise SystemExit("Managed retention delegation missing")
          p.write_text(s)
          PY

      - name: Commit patched memory service
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/memory.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes required."
          else
            git commit -m "Remove legacy memory engine dependencies"
            git push origin HEAD:pyre-memory-1m-10m
          fi
