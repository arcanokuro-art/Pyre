name: Managed memory migration

on:
  push:
    branches: [pyre-memory-1m-10m]
    paths:
      - '.github/workflows/managed-memory-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-memory-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pyre-memory-1m-10m
          fetch-depth: 0

      - name: Replace fixed checkpoint cap with managed retention
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/memory.dart')
          s = p.read_text()
          import_anchor = "import 'llm_debug_log.dart';\n"
          managed_import = "import 'managed_memory_migration.dart';\n"
          if managed_import not in s:
              if import_anchor not in s:
                  raise SystemExit('memory.dart import anchor missing')
              s = s.replace(import_anchor, import_anchor + managed_import, 1)

          old_apply = "void applyCheckpoint(Chat chat, MemoryCheckpoint c) {\n  chat.memoryCheckpoints.add(c);\n  if (chat.memoryCheckpoints.length > _kMaxRetainedCheckpoints) {\n    chat.memoryCheckpoints.removeRange(\n        0, chat.memoryCheckpoints.length - _kMaxRetainedCheckpoints);\n  }\n}\n"
          new_apply = "void applyCheckpoint(Chat chat, MemoryCheckpoint c) {\n  applyCheckpointWithManagedRetention(chat, c);\n}\n"
          if old_apply in s:
              s = s.replace(old_apply, new_apply, 1)
          elif new_apply not in s:
              raise SystemExit('legacy applyCheckpoint block missing')

          cap_start = s.find('/// Cap on how many checkpoints we RETAIN per chat.')
          cap_end_marker = 'const int _kMaxRetainedCheckpoints = 60;\n'
          if cap_start >= 0:
              cap_end = s.find(cap_end_marker, cap_start)
              if cap_end < 0:
                  raise SystemExit('legacy checkpoint cap end missing')
              cap_end += len(cap_end_marker)
              while cap_end < len(s) and s[cap_end] == '\n':
                  cap_end += 1
              s = s[:cap_start] + s[cap_end:]

          # The old applyCheckpoint documentation also names the fixed cap.
          # Replace the whole comment prefix instead of depending on wrapping
          # or punctuation from one historical revision of memory.dart.
          apply_doc_start = s.find('/// Append a freshly-generated checkpoint to the chat\'s memory chain, then')
          manual_doc_marker = '/// 2026-07-13 (community request): build a checkpoint the user wrote BY HAND —\n'
          if apply_doc_start >= 0:
              manual_doc_start = s.find(manual_doc_marker, apply_doc_start)
              if manual_doc_start < 0:
                  raise SystemExit('manual checkpoint documentation anchor missing')
              managed_apply_comment = (
                  '/// Append a freshly-generated checkpoint through the managed-memory\n'
                  '/// retention seam. Historical retention is capacity-aware (1M / 2M / 10M)\n'
                  '/// rather than a fixed checkpoint-count cap.\n'
              )
              s = s[:apply_doc_start] + managed_apply_comment + s[manual_doc_start:]

          if '_kMaxRetainedCheckpoints' in s:
              raise SystemExit('legacy fixed checkpoint cap still referenced')
          if managed_import not in s:
              raise SystemExit('managed memory migration import missing')
          if 'applyCheckpointWithManagedRetention(chat, c);' not in s:
              raise SystemExit('managed applyCheckpoint delegation missing')
          p.write_text(s)
          PY

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/memory.dart
          if git diff --cached --quiet; then
            echo 'memory.dart already uses managed retention.'
          else
            git commit -m 'Replace fixed checkpoint cap with managed retention'
            git push origin HEAD:pyre-memory-1m-10m
          fi
