name: Profile picker empty l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          a="""                  'No characters in your library yet. Build or import '
                  'a card first, then come back to pin it here.',"""
          b="""                  es ? 'Todavía no hay personajes en tu biblioteca. Crea o importa una tarjeta y vuelve aquí para fijarla.' : 'No characters in your library yet. Build or import a card first, then come back to pin it here.',"""
          if a not in s: raise SystemExit('marker missing')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize featured picker empty state'
          git push origin HEAD:spanish-localization
