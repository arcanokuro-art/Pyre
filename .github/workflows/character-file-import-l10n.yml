name: Character file import l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          start=s.index('Future<void> _pickAndImportCard')
          end=s.index('// ---------------------------------------------------------------------------', start)
          block=s[start:end]
          pairs=[
            ("const SnackBar(content: Text('Could not read file bytes.'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'No se pudieron leer los datos del archivo.' : 'Could not read file bytes.'))"),
            ("const SnackBar(content: Text('Import cancelled.'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'Importación cancelada.' : 'Import cancelled.'))"),
            ("SnackBar(content: Text('Imported ${character.name}'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'Se importó ${character.name}' : 'Imported ${character.name}'))"),
            ("SnackBar(content: Text('Import failed: $e'))", "SnackBar(content: Text(AppStrings.of(context).es ? 'Error al importar: $e' : 'Import failed: $e'))"),
          ]
          for a,b in pairs:
            if block.count(a)!=1: raise SystemExit(f'matches {block.count(a)} for {a}')
            block=block.replace(a,b,1)
          p.write_text(s[:start]+block+s[end:])
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character file import messages'
          git push origin HEAD:spanish-localization
