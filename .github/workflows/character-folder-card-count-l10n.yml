name: Character folder card counts l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          old="'${store.characters.length} card${store.characters.length == 1 ? '' : 's'}'"
          new="AppStrings.of(sheetCtx).es ? '${store.characters.length} tarjeta${store.characters.length == 1 ? '' : 's'}' : '${store.characters.length} card${store.characters.length == 1 ? '' : 's'}'"
          if old not in s: raise SystemExit('all-character count not found')
          s=s.replace(old,new,1)
          old2="'${f.characterIds.length} card${f.characterIds.length == 1 ? '' : 's'}'"
          new2="AppStrings.of(sheetCtx).es ? '${f.characterIds.length} tarjeta${f.characterIds.length == 1 ? '' : 's'}' : '${f.characterIds.length} card${f.characterIds.length == 1 ? '' : 's'}'"
          if old2 not in s: raise SystemExit('folder count not found')
          p.write_text(s.replace(old2,new2,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character folder card counts'
          git push origin HEAD:spanish-localization
