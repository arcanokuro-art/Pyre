name: Language selector v2

on:
  push:
    branches: [spanish-localization]
    paths:
      - '.github/workflows/language-selector-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Add language setter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/state/app_store.dart')
          s = p.read_text()
          if 'void setLanguageCode(String code)' not in s:
              marker = '  /// Reorder a provider in the list'
              if marker not in s:
                  raise SystemExit('AppStore insertion marker not found')
              addition = """  /// Change the device-local UI language and persist it.
  void setLanguageCode(String code) {
    final normalized = code == 'en' ? 'en' : 'es';
    if (uiPrefs.languageCode == normalized) return;
    uiPrefs.languageCode = normalized;
    _bump();
  }

"""
              s = s.replace(marker, addition + marker, 1)
              p.write_text(s)
          PY
      - name: Commit language setter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/state/app_store.dart
          if git diff --cached --quiet; then
            echo 'Language setter already present.'
          else
            git commit -m 'Persist language changes from settings'
            git push origin HEAD:spanish-localization
          fi
