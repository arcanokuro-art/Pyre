name: Tag picker help l10n
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/characters_screen.dart')
          s = p.read_text()
          old = """                    'Tap to select. Multiple selections AND together '
                    '(card must have all selected tags).',"""
          new = """                    AppStrings.of(sheetCtx).es
                        ? 'Toca para seleccionar. Varias selecciones se combinan con Y; la tarjeta debe tener todas las etiquetas seleccionadas.'
                        : 'Tap to select. Multiple selections AND together (card must have all selected tags).',"""
          if s.count(old) != 1:
              raise SystemExit('target count=' + str(s.count(old)))
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize tag picker help text'
          git push origin HEAD:spanish-localization
