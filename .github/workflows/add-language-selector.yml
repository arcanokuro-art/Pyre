name: Add language selector

on:
  push:
    branches: [spanish-localization]
    paths:
      - '.github/workflows/add-language-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - name: Add language setter and More selector
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/state/app_store.dart')
          s = p.read_text()
          anchor = '''  void setBackgroundGeneration(bool v) {
            if (uiPrefs.backgroundGeneration == v) return;
            uiPrefs.backgroundGeneration = v;
            GenerationKeepAlive.promoteAllToHeavy = v;
            _bump();
          }
'''
          insert = anchor + '''
          /// Device-local UI language. Spanish is the default; English remains
          /// available. Unknown values are normalized to Spanish.
          void setLanguageCode(String code) {
            final normalized = code == 'en' ? 'en' : 'es';
            if (uiPrefs.languageCode == normalized) return;
            uiPrefs.languageCode = normalized;
            _bump();
          }
'''
          if anchor not in s:
              raise SystemExit('AppStore language setter anchor not found')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)

          p = Path('lib/screens/more_screen.dart')
          s = p.read_text()
          anchor = '''          _MoreCard(rows: [
            _MoreRow(
              label: l.appearance,
              trailing: _themeName(store.uiPrefs.activeThemeId),
              onTap: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => const ThemeSettingsScreen())),
            ),
          ]),
'''
          replacement = '''          _MoreCard(rows: [
            _MoreRow(
              label: l.appearance,
              trailing: _themeName(store.uiPrefs.activeThemeId),
              onTap: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => const ThemeSettingsScreen())),
            ),
            _MoreRow(
              label: l.es ? 'Idioma' : 'Language',
              trailing: store.uiPrefs.languageCode == 'en' ? 'English' : 'Español',
              onTap: () => _showLanguagePicker(context, store),
            ),
          ]),
'''
          if anchor not in s:
              raise SystemExit('More screen appearance card anchor not found')
          s = s.replace(anchor, replacement, 1)
          marker = '''class _VersionFooter extends StatefulWidget {'''
          helper = '''Future<void> _showLanguagePicker(BuildContext context, AppStore store) async {
            final l = AppStrings.of(context);
            final selected = await showModalBottomSheet<String>(
              context: context,
              builder: (sheetContext) => SafeArea(
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    ListTile(
                      title: Text(l.es ? 'Idioma' : 'Language', style: const TextStyle(fontWeight: FontWeight.w700)),
                    ),
                    RadioListTile<String>(
                      value: 'es',
                      groupValue: store.uiPrefs.languageCode,
                      title: const Text('Español'),
                      onChanged: (value) => Navigator.of(sheetContext).pop(value),
                    ),
                    RadioListTile<String>(
                      value: 'en',
                      groupValue: store.uiPrefs.languageCode,
                      title: const Text('English'),
                      onChanged: (value) => Navigator.of(sheetContext).pop(value),
                    ),
                    const SizedBox(height: 8),
                  ],
                ),
              ),
            );
            if (selected != null) store.setLanguageCode(selected);
          }

          '''
          if marker not in s:
              raise SystemExit('More screen helper insertion anchor not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
      - name: Format changed Dart files
        run: dart format lib/state/app_store.dart lib/screens/more_screen.dart
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/state/app_store.dart lib/screens/more_screen.dart
          git diff --cached --quiet || git commit -m 'Add persistent Spanish English language selector'
          git push origin HEAD:spanish-localization
