name: Character import button l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/characters_screen.dart'); s=p.read_text()
          old="                : const Text('Import'),"
          new="                : Text(AppStrings.of(ctx).es ? 'Importar' : 'Import'),"
          if s.count(old)!=1: raise SystemExit(f'count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/characters_screen.dart
          git commit -m 'Localize character URL import action'
          git push origin HEAD:spanish-localization
