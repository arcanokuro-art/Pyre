name: Main nav l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart'); s=p.read_text()
          old="    const labels = ['Chats', 'Library', 'Discover', 'More'];"
          new="    final es = AppStrings.of(context).es;\n    final labels = es\n        ? const ['Chats', 'Biblioteca', 'Descubrir', 'Más']\n        : const ['Chats', 'Library', 'Discover', 'More'];"
          if old not in s: raise SystemExit('nav labels marker missing')
          s=s.replace(old,new,1); p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/main.dart
          git commit -m 'Localize root navigation labels'
          git push origin HEAD:spanish-localization
