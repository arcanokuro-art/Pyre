name: Persona picker search simple
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/chat_picker_screens.dart')
          s=p.read_text()
          target="hintText: 'Search personas…',"
          repl="hintText: AppStrings.of(context).es ? 'Buscar personas…' : 'Search personas…',"
          if s.count(target) != 1: raise SystemExit(s.count(target))
          s=s.replace(target,repl,1)
          s=s.replace('decoration: const InputDecoration(\n                prefixIcon: Icon(Icons.search, size: 18),\n                hintText: AppStrings.of(context).es', 'decoration: InputDecoration(\n                prefixIcon: const Icon(Icons.search, size: 18),\n                hintText: AppStrings.of(context).es', 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/chat_picker_screens.dart
          git commit -m 'Localize persona picker search safely'
          git push origin HEAD:spanish-localization
