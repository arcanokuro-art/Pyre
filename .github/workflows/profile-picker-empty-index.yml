name: Profile picker empty index
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          needle="'No characters in your library yet. Build or import '"
          i=s.find(needle)
          if i<0: raise SystemExit('start missing')
          line_start=s.rfind('\n',0,i)+1
          endneedle="'a card first, then come back to pin it here.',"
          j=s.find(endneedle,i)
          if j<0: raise SystemExit('end missing')
          line_end=s.find('\n',j)+1
          indent=s[line_start:i]
          repl=indent+"es ? 'Todavía no hay personajes en tu biblioteca. Crea o importa una tarjeta y vuelve aquí para fijarla.' : 'No characters in your library yet. Build or import a card first, then come back to pin it here.',\n"
          s=s[:line_start]+repl+s[line_end:]
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize featured picker empty state'
          git push origin HEAD:spanish-localization
