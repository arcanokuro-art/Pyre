name: Storage debug card l10n
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-localization
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/storage_screen.dart')
          s=p.read_text()
          pairs={
            "'Log raw LLM calls (debug)'":"(AppStrings.of(context).es ? 'Registrar llamadas LLM sin procesar (depuración)' : 'Log raw LLM calls (debug)')",
            "'View log'":"(AppStrings.of(context).es ? 'Ver registro' : 'View log')",
            "'Export logs'":"(AppStrings.of(context).es ? 'Exportar registros' : 'Export logs')",
            "'Copy logs'":"(AppStrings.of(context).es ? 'Copiar registros' : 'Copy logs')",
            "'Clear logs'":"(AppStrings.of(context).es ? 'Borrar registros' : 'Clear logs')",
          }
          for a,b in pairs.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/storage_screen.dart
          git commit -m 'Localize storage debug log actions'
          git push origin HEAD:spanish-localization
