name: Profile l10n 2
'on': push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: spanish-localization}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/botbooru_profile_screen.dart'); s=p.read_text()
          s=s.replace("    final hasAvatar = avatar != null && avatar!.isNotEmpty;\n    final display", "    final es = AppStrings.of(context).es;\n    final hasAvatar = avatar != null && avatar!.isNotEmpty;\n    final display",1)
          s=s.replace(": (editMode ? 'No username set' : 'Anonymous creator');", ": (editMode ? (es ? 'Sin nombre de usuario' : 'No username set') : (es ? 'Creador anónimo' : 'Anonymous creator'));",1)
          s=s.replace("label: 'Add profile picture'", "label: es ? 'Añadir foto de perfil' : 'Add profile picture'",1)
          s=s.replace("label: 'Change'", "label: es ? 'Cambiar' : 'Change'",1)
          s=s.replace("label: 'Recrop'", "label: es ? 'Recortar de nuevo' : 'Recrop'",1)
          s=s.replace("label: 'Remove'", "label: es ? 'Eliminar' : 'Remove'",1)
          # Identity edit card labels and hints in the next section.
          marker="  Widget build(BuildContext context) {\n    return Container("
          # choose the occurrence after class _IdentityEditCard
          pos=s.index('class _IdentityEditCard'); idx=s.index(marker,pos)
          s=s[:idx]+s[idx:].replace(marker,"  Widget build(BuildContext context) {\n    final es = AppStrings.of(context).es;\n    return Container(",1)
          s=s.replace("            'IDENTITY',", "            es ? 'IDENTIDAD' : 'IDENTITY',",1)
          s=s.replace("            'Username',", "            es ? 'Nombre de usuario' : 'Username',",1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add lib/screens/botbooru_profile_screen.dart
          git commit -m 'Localize profile avatar and identity controls'
          git push origin HEAD:spanish-localization
