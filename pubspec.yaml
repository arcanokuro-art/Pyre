name: pyre
description: "Pyre — a powerful, private roleplay frontend. BYOK."
publish_to: 'none'
version: 1.2.3+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  crypto: ^3.0.6
  web: ^1.1.0
  fetch_client: ^1.1.2
  cryptography: ^2.7.0
  file_picker: ^10.3.4
  image_picker: ^1.1.2
  uuid: ^4.5.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  webview_windows: ^0.4.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  syncfusion_flutter_pdf: ^30.2.4
  share_plus: ^10.1.4
  image: ^4.3.0
  archive: ^4.0.9
  flutter_foreground_task: ^9.1.0
  package_info_plus: ^8.1.0
  window_manager: ^0.4.3
  tray_manager: ^0.3.1
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: false
  windows:
    generate: true
    image_path: 'assets/icon/icon.png'
    icon_size: 256
  image_path: 'assets/icon/icon.png'
  adaptive_icon_background: '#0B0B0F'
  adaptive_icon_foreground: 'assets/icon/icon_foreground.png'
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
    - assets/examples/avatars/
    - assets/scene_bg/manifest.json
    - assets/scene_bg/images/
    - assets/icon/app_icon.ico
